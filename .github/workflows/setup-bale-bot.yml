name: Setup Complete Bale Bot (Secure)

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'توکن ربات بله (از @BotFather بگیرید)'
        required: true
        type: string
      bot_password:
        description: 'رمز عبور شخصی ربات (فقط شما بدانید)'
        required: true
        type: string

jobs:
  create-secure-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Git Config
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Create Bale Bot Directory Structure
        run: |
          # ایجاد ساختار پوشه‌ها
          mkdir -p bale-bot/{handlers,utils,files,logs,data}
          
          # ایجاد پوشه‌های زیرمجموعه برای فایل‌ها
          mkdir -p bale-bot/files/{downloads,telegram,google-play,temp}
          
          echo "✅ ساختار پوشه‌ها ایجاد شد"
          ls -la bale-bot/
      
      - name: Create requirements.txt
        run: |
          cat > bale-bot/requirements.txt << 'EOF'
          pyTelegramBotAPI==4.16.1
          requests==2.32.3
          python-dotenv==1.0.1
          aiohttp==3.9.5
          beautifulsoup4==4.12.3
          argon2-cffi==23.1.0
          EOF
      
      - name: Create config.py with password hashing
        run: |
          python3 << EOF
          import hashlib
          import os
          
          password = "${{ github.event.inputs.bot_password }}"
          salt = os.urandom(32).hex()
          password_hash = hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100000).hex()
          
          with open('bale-bot/config.py', 'w') as f:
              f.write(f'''import os
          import hashlib
          
          # توکن ربات
          BOT_TOKEN = os.environ.get('BALE_TOKEN')
          
          # هش رمز عبور ذخیره شده در Secrets
          REQUIRED_PASSWORD_HASH = os.environ.get('BOT_PASSWORD_HASH')
          PASSWORD_SALT = os.environ.get('PASSWORD_SALT')
          
          # پوشه ریشه ربات (فقط به همین پوشه دسترسی دارد)
          BOT_ROOT = os.path.dirname(os.path.abspath(__file__))
          FILES_DIR = os.path.join(BOT_ROOT, 'files')
          
          # پوشه‌های مجاز داخل ربات
          ALLOWED_DIRS = {{
              'downloads': os.path.join(FILES_DIR, 'downloads'),
              'telegram': os.path.join(FILES_DIR, 'telegram'),
              'google-play': os.path.join(FILES_DIR, 'google-play'),
          }}
          
          # فرمت‌های مجاز فایل
          ALLOWED_EXTENSIONS = ['.txt', '.pdf', '.jpg', '.png', '.zip', '.md', '.json', '.html', '.apk']
          
          # محدودیت حجم فایل (20 مگابایت)
          MAX_FILE_SIZE_MB = 20
          
          def verify_password(input_password: str) -> bool:
              """تأیید رمز عبور"""
              if not REQUIRED_PASSWORD_HASH or not PASSWORD_SALT:
                  return False
              input_hash = hashlib.pbkdf2_hmac('sha256', input_password.encode(), PASSWORD_SALT.encode(), 100000).hex()
              return input_hash == REQUIRED_PASSWORD_HASH
          
          # دستورات ربات
          COMMANDS = {{
              '/start': 'شروع و احراز هویت',
              '/auth <رمز>': 'احراز هویت با رمز عبور',
              '/list': 'لیست فایل‌های قابل دسترس',
              '/download <نام فایل>': 'دانلود فایل',
              '/search <کلمه>': 'جستجو در فایل‌ها',
              '/folders': 'نمایش پوشه‌ها',
              '/status': 'وضعیت احراز هویت',
              '/help': 'راهنما'
          }}
          ''')
          
          # ذخیره هش و salt برای استفاده در Secrets
          with open('password_hash.txt', 'w') as f:
              f.write(password_hash)
          with open('password_salt.txt', 'w') as f:
              f.write(salt)
          
          print(f"✅ Password hash created: {password_hash[:20]}...")
          EOF
      
      - name: Create bot.py
        run: |
          cat > bale-bot/bot.py << 'EOF'
          import telebot
          import time
          import os
          import sys
          import json
          import glob
          from telebot import api
          from datetime import datetime
          
          # تنظیم endpoint مخصوص بله
          api.TELEGRAM_API_URL = 'https://tapi.bale.ai/bot{0}/{1}'
          
          # اضافه کردن مسیر جاری به sys.path
          sys.path.append(os.path.dirname(os.path.abspath(__file__)))
          
          from config import (
              BOT_TOKEN, verify_password, ALLOWED_DIRS, ALLOWED_EXTENSIONS,
              MAX_FILE_SIZE_MB, COMMANDS
          )
          
          if not BOT_TOKEN:
              print("❌ خطا: توکن ربات تنظیم نشده است!")
              sys.exit(1)
          
          bot = telebot.TeleBot(BOT_TOKEN)
          
          # فایل ذخیره کاربران مجاز
          AUTH_FILE = os.path.join(os.path.dirname(__file__), 'data', 'authorized_users.json')
          
          def load_authorized_users():
              try:
                  if os.path.exists(AUTH_FILE):
                      with open(AUTH_FILE, 'r') as f:
                          data = json.load(f)
                          return set(data.get('users', []))
              except Exception as e:
                  print(f"خطا در بارگذاری کاربران: {e}")
              return set()
          
          def save_authorized_users(users):
              try:
                  os.makedirs(os.path.dirname(AUTH_FILE), exist_ok=True)
                  with open(AUTH_FILE, 'w') as f:
                      json.dump({'users': list(users), 'updated_at': datetime.now().isoformat()}, f)
              except Exception as e:
                  print(f"خطا در ذخیره کاربران: {e}")
          
          authorized_users = load_authorized_users()
          
          def is_authorized(user_id):
              return str(user_id) in authorized_users
          
          def auth_required(func):
              def wrapper(message):
                  if is_authorized(message.chat.id):
                      return func(message)
                  else:
                      bot.reply_to(message, "🔒 **دسترسی محدود!** لطفاً ابتدا با `/auth <رمز>` احراز هویت کنید.", parse_mode='Markdown')
                  return None
              return wrapper
          
          @bot.message_handler(commands=['start'])
          def send_welcome(message):
              welcome_text = f"""
          🔐 **ربات شخصی مدیریت فایل**
          
          سلام {message.from_user.first_name} 👋
          
          **برای دسترسی، ابتدا احراز هویت کنید:**
          `/auth <رمز عبور>`
          
          **پس از احراز هویت، دستورات زیر در دسترس هستند:**
          {chr(10).join([f'• `{cmd}` - {desc}' for cmd, desc in COMMANDS.items() if cmd != '/auth'])}
          
          📁 **پوشه‌های قابل دسترس:**
          • downloads/ - فایل‌های دانلودی
          • telegram/ - فایل‌های تلگرام
          • google-play/ - فایل‌های گوگل پلی
          """
              bot.reply_to(message, welcome_text, parse_mode='Markdown')
          
          @bot.message_handler(commands=['auth'])
          def authenticate(message):
              parts = message.text.split()
              if len(parts) != 2:
                  bot.reply_to(message, "❌ **فرمت صحیح:** `/auth <رمز عبور>`", parse_mode='Markdown')
                  return
              
              password = parts[1]
              if verify_password(password):
                  user_id = str(message.chat.id)
                  authorized_users.add(user_id)
                  save_authorized_users(authorized_users)
                  bot.reply_to(message, "✅ **احراز هویت موفق!** اکنون به تمام دستورات دسترسی دارید.", parse_mode='Markdown')
              else:
                  bot.reply_to(message, "❌ **رمز عبور اشتباه است!** دسترسی denied.", parse_mode='Markdown')
          
          @bot.message_handler(commands=['status'])
          @auth_required
          def check_status(message):
              status_text = f"""
          🔐 **وضعیت احراز هویت**
          
          • وضعیت: {'✅ مجاز' if is_authorized(message.chat.id) else '❌ غیرمجاز'}
          • شناسه کاربری: `{message.chat.id}`
          • تاریخ: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}
          """
              bot.reply_to(message, status_text, parse_mode='Markdown')
          
          @bot.message_handler(commands=['folders'])
          @auth_required
          def list_folders(message):
              response = "**📂 پوشه‌های قابل دسترس:**\n\n"
              for name, path in ALLOWED_DIRS.items():
                  if os.path.exists(path):
                      file_count = 0
                      for ext in ALLOWED_EXTENSIONS:
                          file_count += len(glob.glob(os.path.join(path, f'*{ext}')))
                      response += f"✅ **{name}/** - {file_count} فایل\n\n"
                  else:
                      response += f"⚠️ **{name}/** - پوشه وجود ندارد\n\n"
              bot.reply_to(message, response, parse_mode='Markdown')
          
          @bot.message_handler(commands=['list'])
          @auth_required
          def list_files(message):
              all_files = []
              for name, path in ALLOWED_DIRS.items():
                  if os.path.exists(path):
                      for ext in ALLOWED_EXTENSIONS:
                          for file_path in glob.glob(os.path.join(path, f'*{ext}')):
                              file_name = os.path.basename(file_path)
                              size = os.path.getsize(file_path)
                              all_files.append({'name': file_name, 'folder': name, 'size': size, 'size_mb': size/(1024*1024)})
              
              if not all_files:
                  bot.reply_to(message, "📂 **هیچ فایلی یافت نشد.**", parse_mode='Markdown')
                  return
              
              response = "**📁 لیست فایل‌ها:**\n\n"
              for folder in ALLOWED_DIRS.keys():
                  folder_files = [f for f in all_files if f['folder'] == folder]
                  if folder_files:
                      response += f"**📂 {folder}/**\n"
                      for f in folder_files[:10]:
                          size_str = f"{f['size_mb']:.2f} MB" if f['size_mb'] >= 1 else f"{f['size']/1024:.1f} KB"
                          response += f"• `{f['name']}` ({size_str})\n"
                      response += "\n"
              
              response += "💡 `/download <نام فایل>`"
              bot.reply_to(message, response, parse_mode='Markdown')
          
          @bot.message_handler(commands=['search'])
          @auth_required
          def search_files(message):
              query = ' '.join(message.text.split()[1:])
              if not query:
                  bot.reply_to(message, "❌ `/search <کلمه>`", parse_mode='Markdown')
                  return
              
              results = []
              for name, path in ALLOWED_DIRS.items():
                  if os.path.exists(path):
                      for ext in ALLOWED_EXTENSIONS:
                          for file_path in glob.glob(os.path.join(path, f'*{ext}')):
                              file_name = os.path.basename(file_path)
                              if query.lower() in file_name.lower():
                                  size = os.path.getsize(file_path)
                                  results.append({'name': file_name, 'folder': name, 'size_mb': size/(1024*1024)})
              
              if not results:
                  bot.reply_to(message, f"🔍 **نتیجه‌ای برای '{query}' یافت نشد.**", parse_mode='Markdown')
                  return
              
              response = f"**🔍 نتایج جستجو برای '{query}':**\n\n"
              for r in results[:20]:
                  response += f"• `{r['name']}` [{r['folder']}]\n"
              response += "\n💡 `/download <نام فایل>`"
              bot.reply_to(message, response, parse_mode='Markdown')
          
          @bot.message_handler(commands=['download'])
          @auth_required
          def download_file(message):
              filename = ' '.join(message.text.split()[1:])
              if not filename:
                  bot.reply_to(message, "❌ `/download <نام فایل>`", parse_mode='Markdown')
                  return
              
              found_file = None
              for name, path in ALLOWED_DIRS.items():
                  if os.path.exists(path):
                      for ext in ALLOWED_EXTENSIONS:
                          for file_path in glob.glob(os.path.join(path, f'*{ext}')):
                              if os.path.basename(file_path) == filename:
                                  found_file = file_path
                                  break
                      if found_file:
                          break
              
              if not found_file:
                  bot.reply_to(message, f"❌ **فایل '{filename}' یافت نشد.**", parse_mode='Markdown')
                  return
              
              file_size = os.path.getsize(found_file)
              if file_size > MAX_FILE_SIZE_MB * 1024 * 1024:
                  bot.reply_to(message, f"⚠️ **فایل بزرگتر از {MAX_FILE_SIZE_MB} مگابایت است.**", parse_mode='Markdown')
                  return
              
              try:
                  with open(found_file, 'rb') as f:
                      bot.send_document(message.chat.id, f, caption=f"📄 **{filename}**")
              except Exception as e:
                  bot.reply_to(message, f"❌ **خطا:** `{str(e)}`", parse_mode='Markdown')
          
          @bot.message_handler(commands=['help'])
          @auth_required
          def send_help(message):
              help_text = """
          📚 **راهنما**
          
          🔐 `/auth <رمز>` - احراز هویت
          📁 `/list` - نمایش همه فایل‌ها
          🔍 `/search <کلمه>` - جستجو
          📥 `/download <نام>` - دانلود فایل
          📂 `/folders` - نمایش پوشه‌ها
          ℹ️ `/status` - وضعیت احراز هویت
          """
              bot.reply_to(message, help_text, parse_mode='Markdown')
          
          @bot.message_handler(func=lambda message: True)
          def unknown_command(message):
              if is_authorized(message.chat.id):
                  bot.reply_to(message, "❓ دستور نامعتبر. `/help`", parse_mode='Markdown')
              else:
                  bot.reply_to(message, "🔒 لطفاً با `/auth` احراز هویت کنید.", parse_mode='Markdown')
          
          def run_polling():
              print("✅ ربات شروع به کار کرد!")
              for path in ALLOWED_DIRS.values():
                  os.makedirs(path, exist_ok=True)
              
              try:
                  bot.infinity_polling(timeout=30, long_polling_timeout=30)
              except Exception as e:
                  print(f"❌ خطا: {e}")
                  time.sleep(5)
          
          if __name__ == '__main__':
              run_polling()
          EOF
      
      - name: Create sample files
        run: |
          echo "این یک فایل نمونه است" > bale-bot/files/downloads/sample.txt
          echo "# نمونه فایل README" > bale-bot/files/telegram/README.md
          echo '{"version": "1.0"}' > bale-bot/files/google-play/config.json
          touch bale-bot/logs/.gitkeep
          touch bale-bot/data/.gitkeep
      
      - name: Create GitHub Actions workflow for scheduler
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/bale-bot-scheduler.yml << 'EOF'
          name: Bale Bot Scheduler
          
          on:
            schedule:
              - cron: '*/2 * * * *'
            workflow_dispatch:
          
          jobs:
            run-bot:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                
                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.9'
                
                - name: Install dependencies
                  working-directory: ./bale-bot
                  run: |
                    pip install pyTelegramBotAPI requests python-dotenv
                
                - name: Run Bale Bot
                  working-directory: ./bale-bot
                  env:
                    BALE_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
                    BOT_PASSWORD_HASH: ${{ secrets.BOT_PASSWORD_HASH }}
                    PASSWORD_SALT: ${{ secrets.PASSWORD_SALT }}
                  run: |
                    timeout 115s python bot.py || true
          EOF
      
      - name: Create .gitignore entries
        run: |
          echo "" >> .gitignore
          echo "# Bale bot" >> .gitignore
          echo "bale-bot/data/authorized_users.json" >> .gitignore
          echo "bale-bot/logs/*.log" >> .gitignore
          echo "bale-bot/__pycache__/" >> .gitignore
          echo "bale-bot/*.pyc" >> .gitignore
          echo "password_hash.txt" >> .gitignore
          echo "password_salt.txt" >> .gitignore
      
      - name: Save password hash to environment
        run: |
          HASH=$(cat password_hash.txt)
          SALT=$(cat password_salt.txt)
          echo "BOT_PASSWORD_HASH=$HASH" >> $GITHUB_ENV
          echo "PASSWORD_SALT=$SALT" >> $GITHUB_ENV
      
      - name: Commit and push all changes
        run: |
          git add .
          git commit -m "🔐 افزودن ربات شخصی بله با احراز هویت" || echo "تغییری وجود ندارد"
          git push || echo "خطا در push (شاید نیازی نباشد)"
      
      - name: Create setup artifact
        run: |
          cat > SETUP_INFO.txt << 'EOF'
          🔐 ربات شخصی بله با موفقیت ایجاد شد!
          
          حالا باید این Secrets را در مخزن تنظیم کنید:
          
          1. BALE_BOT_TOKEN = توکن ربات شما
          2. BOT_PASSWORD_HASH = مقدار داخل password_hash.txt
          3. PASSWORD_SALT = مقدار داخل password_salt.txt
          
          سپس در بله ربات را استارت کرده و دستور /auth <رمز> را بزنید.
          EOF
          
          echo "BOT_PASSWORD_HASH=${{ env.BOT_PASSWORD_HASH }}" > secrets.txt
          echo "PASSWORD_SALT=${{ env.PASSWORD_SALT }}" >> secrets.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bale-bot-secrets
          path: |
            password_hash.txt
            password_salt.txt
            secrets.txt
            SETUP_INFO.txt