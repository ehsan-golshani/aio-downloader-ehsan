          # فایل requirements
          cat > requirements.txt << 'REQ'
pyTelegramBotAPI==4.16.1
requests==2.32.3
REQ
          
          echo "✅ ربات ساخته شد"
      
      - name: ایجاد ورکفلو زمانبند
        run: |
          cat > .github/workflows/bale-scheduler.yml << 'SCH'
name: Bale Bot Scheduler

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: ./bale-bot
        run: pip install -r requirements.txt
      
      - name: Run Bale Bot
        working-directory: ./bale-bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          timeout 115s python bot.py || true
SCH
          echo "✅ ورکفلو زمانبند ساخته شد"
      
      - name: ایجاد فایل‌های مورد نیاز
        run: |
          # اطمینان از وجود channels.json
          if [ ! -f channels.json ]; then
            echo '{"channels": []}' > channels.json
          fi
          
          # اطمینان از وجود last_id.txt
          if [ ! -f last_id.txt ]; then
            echo "0" > last_id.txt
          fi
          
          # اطمینان از وجود پوشه telegram
          mkdir -p telegram
          
          echo "✅ فایل‌های اولیه بررسی شدند"
      
      - name: Commit همه تغییرات
        run: |
          git config user.name "Bot Builder"
          git config user.email "bot@github.com"
          git add bale-bot/ .github/workflows/bale-scheduler.yml channels.json last_id.txt
          git commit -m "🤖 افزودن ربات کامل بله با مدیریت کانال و فایل" || echo "تغییری نیست"
          git push