name: 🔐 Bale Bot Final Setup

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. حذف پوشه قبلی bale-bot
      - name: Remove old bale-bot
        run: rm -rf bale-bot

      # 2. ایجاد ساختار جدید
      - name: Create new structure
        run: |
          mkdir -p bale-bot/files
          mkdir -p bale-bot/data
          mkdir -p bale-bot/utils
          mkdir -p .github/workflows

      # 3. فایل requirements
      - name: Create requirements.txt
        run: |
          cat > bale-bot/requirements.txt << 'EOF'
          pyTelegramBotAPI
          requests
          EOF

      # 4. فایل اصلی ربات (bot.py) با همه قابلیت‌ها
      - name: Create bot.py
        run: |
          cat > bale-bot/bot.py << 'BOT'
import telebot
import os
import json
import hashlib
import requests
import glob
from telebot import api
from telebot.types import InlineKeyboardMarkup, InlineKeyboardButton

api.TELEGRAM_API_URL = 'https://tapi.bale.ai/bot{0}/{1}'

TOKEN = os.environ.get('BALE_TOKEN')
if not TOKEN:
    print("❌ توکن یافت نشد")
    exit(1)

bot = telebot.TeleBot(TOKEN)

# مسیرهای اصلی مخزن (دسترسی فقط به این پوشه‌ها)
REPO_ROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
TELEGRAM_DIR = os.path.join(REPO_ROOT, 'telegram')
PLAY_DIR = os.path.join(REPO_ROOT, 'google-play')
BOT_DATA_DIR = os.path.join(os.path.dirname(__file__), 'data')
os.makedirs(BOT_DATA_DIR, exist_ok=True)

CONFIG_FILE = os.path.join(BOT_DATA_DIR, 'config.json')
CHANNELS_FILE = os.path.join(BOT_DATA_DIR, 'channels.json')
WORKFLOWS_FILE = os.path.join(BOT_DATA_DIR, 'workflows_cache.json')

# ========== توابع هش و رمز ==========
def init_config():
    if not os.path.exists(CONFIG_FILE):
        with open(CONFIG_FILE, 'w') as f:
            json.dump({"first_run": True, "salt": "", "hash": ""}, f)

def save_config(data):
    with open(CONFIG_FILE, 'w') as f:
        json.dump(data, f)

def load_config():
    with open(CONFIG_FILE, 'r') as f:
        return json.load(f)

def hash_password(password, salt):
    return hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100000).hex()

# ========== مدیریت کانال‌ها (پوشه‌های داخل telegram) ==========
def load_channels():
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            return json.load(f)
    # اگر فایل نبود، از پوشه‌های واقعی بخوان
    channels = []
    if os.path.exists(TELEGRAM_DIR):
        for item in os.listdir(TELEGRAM_DIR):
            if os.path.isdir(os.path.join(TELEGRAM_DIR, item)):
                channels.append(item)
    return channels

def save_channels(channels):
    with open(CHANNELS_FILE, 'w') as f:
        json.dump(channels, f)

def add_channel(name):
    channels = load_channels()
    if name not in channels:
        channels.append(name)
        save_channels(channels)
        # ساختن پوشه فیزیکی
        os.makedirs(os.path.join(TELEGRAM_DIR, name), exist_ok=True)
    return channels

def remove_channel(name):
    channels = load_channels()
    if name in channels:
        channels.remove(name)
        save_channels(channels)
        # حذف پوشه فیزیکی (اختیاری)
        import shutil
        shutil.rmtree(os.path.join(TELEGRAM_DIR, name), ignore_errors=True)
    return channels

# ========== نمایش درختی فایل‌ها ==========
def get_file_tree(base_path, relative_path=""):
    items = []
    try:
        for item in sorted(os.listdir(base_path)):
            item_path = os.path.join(base_path, item)
            rel_path = os.path.join(relative_path, item) if relative_path else item
            if os.path.isdir(item_path):
                items.append({"name": item, "type": "dir", "path": rel_path})
            else:
                size = os.path.getsize(item_path)
                items.append({"name": item, "type": "file", "path": rel_path, "size": size})
    except:
        pass
    return items

def send_folder_menu(message, base_path, title, callback_prefix):
    items = get_file_tree(base_path)
    if not items:
        bot.reply_to(message, "📂 این پوشه خالیه")
        return
    markup = InlineKeyboardMarkup(row_width=1)
    for item in items:
        if item["type"] == "dir":
            markup.add(InlineKeyboardButton(f"📁 {item['name']}", callback_data=f"{callback_prefix}_dir_{item['path']}"))
        else:
            size_kb = item["size"] / 1024
            size_str = f"{size_kb:.1f}KB" if size_kb < 1024 else f"{size_kb/1024:.1f}MB"
            markup.add(InlineKeyboardButton(f"📄 {item['name']} ({size_str})", callback_data=f"{callback_prefix}_file_{item['path']}"))
    markup.add(InlineKeyboardButton("🔙 بازگشت", callback_data=f"{callback_prefix}_back"))
    bot.reply_to(message, f"📂 {title}", reply_markup=markup)

# ========== اجرای ورکفلو با GitHub API ==========
def run_workflow(workflow_id):
    github_token = os.environ.get('GITHUB_TOKEN')
    if not github_token:
        return False, "توکن گیت‌هاب یافت نشد"
    repo = os.environ.get('GITHUB_REPOSITORY')
    url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}/dispatches"
    headers = {"Authorization": f"token {github_token}", "Accept": "application/vnd.github.v3+json"}
    data = {"ref": "main"}
    try:
        r = requests.post(url, json=data, headers=headers)
        if r.status_code == 204:
            return True, "ورکفلو با موفقیت اجرا شد"
        else:
            return False, f"خطا: {r.status_code}"
    except Exception as e:
        return False, str(e)

def list_workflows():
    github_token = os.environ.get('GITHUB_TOKEN')
    if not github_token:
        return []
    repo = os.environ.get('GITHUB_REPOSITORY')
    url = f"https://api.github.com/repos/{repo}/actions/workflows"
    headers = {"Authorization": f"token {github_token}"}
    try:
        r = requests.get(url, headers=headers)
        if r.status_code == 200:
            return r.json().get('workflows', [])
    except:
        pass
    return []

# ========== منوهای اصلی ==========
@bot.message_handler(commands=['start'])
def start(message):
    config = load_config()
    if config.get("first_run", True):
        bot.reply_to(message, "🔐 **خوش آمدید!**\nاین ربات شخصی شماست.\nلطفاً رمز عبور جدید و کلید هش را ارسال کنید.\n\nفرمت:\n`/setup <رمز عبور> <کلید دلخواه>`", parse_mode='Markdown')
        return
    show_main_menu(message)

def show_main_menu(message):
    markup = InlineKeyboardMarkup(row_width=2)
    markup.add(
        InlineKeyboardButton("📁 تلگرام", callback_data="menu_telegram"),
        InlineKeyboardButton("📱 گوگل پلی", callback_data="menu_play"),
        InlineKeyboardButton("⚙️ مدیریت کانال‌ها", callback_data="menu_channels"),
        InlineKeyboardButton("🔄 اجرای ورکفلو", callback_data="menu_workflows"),
        InlineKeyboardButton("ℹ️ وضعیت", callback_data="menu_status")
    )
    bot.reply_to(message, "🤖 **ربات مدیریت فایل‌های گیت‌هاب**\nلطفاً یکی از گزینه‌ها را انتخاب کنید:", reply_markup=markup)

@bot.message_handler(commands=['setup'])
def setup(message):
    parts = message.text.split()
    if len(parts) != 3:
        bot.reply_to(message, "فرمت: `/setup <رمز> <کلید>`", parse_mode='Markdown')
        return
    password = parts[1]
    key = parts[2]
    salt = hashlib.sha256(key.encode()).hexdigest()[:32]
    pwd_hash = hash_password(password, salt)
    save_config({"first_run": False, "salt": salt, "hash": pwd_hash, "key": key})
    bot.reply_to(message, "✅ تنظیمات ذخیره شد.\nربات آماده است. دوباره /start را بزنید.")

# ========== هندلرهای دکمه‌ها ==========
@bot.callback_query_handler(func=lambda call: True)
def callback_handler(call):
    data = call.data
    if data == "menu_telegram":
        send_folder_menu(call.message, TELEGRAM_DIR, "📁 پوشه تلگرام", "tg")
    elif data == "menu_play":
        send_folder_menu(call.message, PLAY_DIR, "📱 پوشه گوگل پلی", "play")
    elif data == "menu_channels":
        channels = load_channels()
        text = "📺 **کانال‌های موجود:**\n" + "\n".join([f"• {ch}" for ch in channels]) if channels else "هیچ کانالی وجود ندارد"
        markup = InlineKeyboardMarkup()
        markup.add(InlineKeyboardButton("➕ افزودن کانال", callback_data="add_channel"))
        markup.add(InlineKeyboardButton("➖ حذف کانال", callback_data="remove_channel"))
        bot.edit_message_text(text, call.message.chat.id, call.message.message_id, reply_markup=markup, parse_mode='Markdown')
    elif data == "add_channel":
        bot.send_message(call.message.chat.id, "نام کانال جدید را ارسال کنید:")
        bot.register_next_step_handler(call.message, add_channel_step)
    elif data == "remove_channel":
        bot.send_message(call.message.chat.id, "نام کانال را برای حذف ارسال کنید:")
        bot.register_next_step_handler(call.message, remove_channel_step)
    elif data == "menu_workflows":
        workflows = list_workflows()
        if not workflows:
            bot.edit_message_text("هیچ ورکفلو یافت نشد یا خطا در اتصال", call.message.chat.id, call.message.message_id)
            return
        markup = InlineKeyboardMarkup(row_width=1)
        for wf in workflows:
            markup.add(InlineKeyboardButton(wf['name'], callback_data=f"run_wf_{wf['id']}"))
        bot.edit_message_text("🔄 **ورکفلوهای موجود:**", call.message.chat.id, call.message.message_id, reply_markup=markup)
    elif data == "menu_status":
        config = load_config()
        channels = load_channels()
        text = f"**وضعیت ربات**\n\n🔐 رمز: {'تنظیم شده' if not config.get('first_run') else 'تنظیم نشده'}\n📺 تعداد کانال‌ها: {len(channels)}\n📁 پوشه تلگرام: {TELEGRAM_DIR}\n📱 پوشه گوگل پلی: {PLAY_DIR}"
        bot.edit_message_text(text, call.message.chat.id, call.message.message_id, parse_mode='Markdown')
    elif data.startswith("tg_dir_"):
        subpath = data[7:]
        full_path = os.path.join(TELEGRAM_DIR, subpath)
        send_folder_menu(call.message, full_path, f"📂 {subpath}", "tg")
    elif data.startswith("tg_file_"):
        subpath = data[8:]
        full_path = os.path.join(TELEGRAM_DIR, subpath)
        if os.path.exists(full_path) and os.path.getsize(full_path) < 20 * 1024 * 1024:
            with open(full_path, 'rb') as f:
                bot.send_document(call.message.chat.id, f, caption=os.path.basename(full_path))
        else:
            bot.answer_callback_query(call.id, "فایل یافت نشد یا حجم بالاست")
    elif data.startswith("play_dir_"):
        subpath = data[9:]
        full_path = os.path.join(PLAY_DIR, subpath)
        send_folder_menu(call.message, full_path, f"📂 {subpath}", "play")
    elif data.startswith("play_file_"):
        subpath = data[10:]
        full_path = os.path.join(PLAY_DIR, subpath)
        if os.path.exists(full_path) and os.path.getsize(full_path) < 20 * 1024 * 1024:
            with open(full_path, 'rb') as f:
                bot.send_document(call.message.chat.id, f, caption=os.path.basename(full_path))
        else:
            bot.answer_callback_query(call.id, "فایل یافت نشد یا حجم بالاست")
    elif data.startswith("run_wf_"):
        wf_id = data[7:]
        success, msg = run_workflow(wf_id)
        bot.answer_callback_query(call.id, msg)
    elif data.endswith("_back"):
        show_main_menu(call.message)

def add_channel_step(message):
    name = message.text.strip()
    if name:
        add_channel(name)
        bot.reply_to(message, f"✅ کانال {name} اضافه شد")
    else:
        bot.reply_to(message, "❌ نام نامعتبر")

def remove_channel_step(message):
    name = message.text.strip()
    if name:
        remove_channel(name)
        bot.reply_to(message, f"✅ کانال {name} حذف شد")
    else:
        bot.reply_to(message, "❌ نام نامعتبر")

# ========== اجرا ==========
init_config()
print("✅ ربات با موفقیت روشن شد")
bot.infinity_polling()
BOT

      # 5. فایل scheduler
      - name: Create scheduler workflow
        run: |
          cat > .github/workflows/bale-runner.yml << 'EOF'
          name: 🏃 Bale Bot Runner
          on:
            schedule:
              - cron: '*/2 * * * *'
            workflow_dispatch:
          jobs:
            run:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.9'
                - name: Install deps
                  working-directory: ./bale-bot
                  run: pip install -r requirements.txt
                - name: Run Bot
                  working-directory: ./bale-bot
                  env:
                    BALE_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                  run: timeout 115s python bot.py || true
          EOF

      # 6. فایل README برای ربات
      - name: Create bot README
        run: |
          cat > bale-bot/README.md << 'EOF'
          # 🤖 ربات بله - مدیریت فایل‌های مخزن
          
          ## دستورات
          - `/start` - منوی اصلی
          - `/setup رمز کلید` - تنظیم اولیه (فقط یک بار)
          
          ## قابلیت‌ها
          - مرور درختی فایل‌های `telegram/` و `google-play/`
          - مدیریت کانال‌ها (افزودن/حذف)
          - اجرای ورکفلوهای گیت‌هاب
          - رمزگذاری شده با هش
          EOF

      # 7. commit نهایی
      - name: Commit and push
        run: |
          git config user.name "Bale Bot Builder"
          git config user.email "bot@github.com"
          git add bale-bot .github/workflows/bale-runner.yml
          git commit -m "✅ ربات بله نهایی با تمام قابلیت‌ها" || echo "تغییری نیست"
          git push