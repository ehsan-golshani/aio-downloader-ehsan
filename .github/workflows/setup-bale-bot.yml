name: 🚀 Build Bale Bot with Full Access

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # برای دیدن لیست ورکفلوها
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🗑️ Remove old bale-bot folder if exists
        run: |
          rm -rf bale-bot
          echo "✅ پوشه قبلی حذف شد"

      - name: 📁 Create new bot structure
        run: |
          mkdir -p bale-bot/files/temp
          mkdir -p bale-bot/handlers
          echo "✅ ساختار پوشه‌ها ایجاد شد"

      # ---------- فایل تنظیمات و ذخیره رمز هش شده ----------
      - name: 🔐 Create password hashing and config
        run: |
          cat > bale-bot/bot_config.py << 'EOF'
import hashlib
import os
import json

CONFIG_FILE = os.path.join(os.path.dirname(__file__), 'config.json')

def load_config():
    if os.path.exists(CONFIG_FILE):
        with open(CONFIG_FILE, 'r') as f:
            return json.load(f)
    return {}

def save_config(data):
    with open(CONFIG_FILE, 'w') as f:
        json.dump(data, f, indent=2)

def hash_password(password, salt=None):
    if salt is None:
        salt = os.urandom(32).hex()
    h = hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100000).hex()
    return h, salt

def verify_password(password, stored_hash, salt):
    h, _ = hash_password(password, salt)
    return h == stored_hash
EOF

      # ---------- فایل اصلی ربات (با کیبورد و مدیریت فایل و وورکفلو) ----------
      - name: 🤖 Create bot.py with all features
        run: |
          cat > bale-bot/bot.py << 'EOF'
import telebot
import os
import json
import glob
import requests
from telebot import types
from telebot import api
from bot_config import load_config, save_config, hash_password, verify_password

# تنظیم endpoint بله
api.TELEGRAM_API_URL = 'https://tapi.bale.ai/bot{0}/{1}'

TOKEN = os.environ.get('BALE_TOKEN')
if not TOKEN:
    raise Exception("توکن ربات پیدا نشد")

bot = telebot.TeleBot(TOKEN)

# مسیرهای مهم
BASE_DIR = os.path.dirname(os.path.abspath(__file__))
TELEGRAM_ROOT = os.path.join(os.path.dirname(BASE_DIR), 'telegram')   # پوشه روت اصلی
WORKFLOWS_DIR = os.path.join(os.path.dirname(BASE_DIR), '.github/workflows')
CONFIG_FILE = os.path.join(BASE_DIR, 'config.json')

# وضعیت کاربران و جلسات
user_states = {}   # chat_id -> {'state': 'browsing', 'path': ...}

# ================== توابع کمکی ==================
def get_github_token():
    # توکن فراهم شده توسط گیت‌هاب اکشن (در زمان اجرا)
    return os.environ.get('GITHUB_TOKEN')

def call_github_api(endpoint, method='GET', data=None):
    token = get_github_token()
    headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github.v3+json'}
    url = f'https://api.github.com/repos/{os.environ.get("GITHUB_REPOSITORY")}/{endpoint}'
    if method == 'GET':
        resp = requests.get(url, headers=headers)
    elif method == 'POST':
        resp = requests.post(url, headers=headers, json=data)
    else:
        return None
    return resp.json() if resp.status_code == 200 else None

def list_workflows():
    # لیست ورکفلوهای موجود
    workflows = call_github_api('actions/workflows')
    if workflows and 'workflows' in workflows:
        return [(wf['name'], wf['id']) for wf in workflows['workflows']]
    return []

def run_workflow(workflow_id):
    # اجرای ورکفلو با dispatch
    resp = call_github_api(f'actions/workflows/{workflow_id}/dispatches', method='POST', data={'ref': 'main'})
    return resp is not None

def get_file_tree(path=''):
    # بازگشت لیست فایل‌ها و پوشه‌ها در مسیر داده شده (نسبت به ریشه مخزن)
    full_path = os.path.join(os.path.dirname(BASE_DIR), path)
    if not os.path.exists(full_path):
        return []
    items = []
    for item in os.listdir(full_path):
        item_path = os.path.join(full_path, item)
        if os.path.isdir(item_path):
            items.append(('dir', item, os.path.join(path, item)))
        else:
            items.append(('file', item, os.path.join(path, item)))
    return items

def get_channels():
    # خواندن فایل channels.json از ریشه مخزن (اگر موجود نباشد، می‌سازیم)
    channels_file = os.path.join(os.path.dirname(BASE_DIR), 'channels.json')
    if os.path.exists(channels_file):
        with open(channels_file, 'r') as f:
            return json.load(f)
    return {}

def save_channels(channels):
    channels_file = os.path.join(os.path.dirname(BASE_DIR), 'channels.json')
    with open(channels_file, 'w') as f:
        json.dump(channels, f, indent=2)

def get_last_id():
    last_id_file = os.path.join(os.path.dirname(BASE_DIR), 'last_id.json')
    if os.path.exists(last_id_file):
        with open(last_id_file, 'r') as f:
            return json.load(f)
    return {}

def save_last_id(data):
    last_id_file = os.path.join(os.path.dirname(BASE_DIR), 'last_id.json')
    with open(last_id_file, 'w') as f:
        json.dump(data, f, indent=2)

# ================== دکمه‌های اصلی ==================
def main_menu_keyboard():
    keyboard = types.InlineKeyboardMarkup(row_width=2)
    btn1 = types.InlineKeyboardButton("📁 مرور فایل‌های تلگرام", callback_data="browse_telegram")
    btn2 = types.InlineKeyboardButton("⚙️ مدیریت کانال‌ها", callback_data="manage_channels")
    btn3 = types.InlineKeyboardButton("🔄 لیست ورکفلوها", callback_data="list_workflows")
    btn4 = types.InlineKeyboardButton("🔑 تغییر رمز عبور", callback_data="change_password")
    keyboard.add(btn1, btn2, btn3, btn4)
    return keyboard

# ================== احراز هویت ==================
def is_authenticated(chat_id):
    cfg = load_config()
    return str(chat_id) in cfg.get('authorized', [])

def auth_required(func):
    def wrapper(message):
        if is_authenticated(message.chat.id):
            return func(message)
        else:
            bot.reply_to(message, "🔒 ابتدا رمز عبور را وارد کنید.\nدستور: /auth <رمز>")
    return wrapper

# ================== دستورات ==================
@bot.message_handler(commands=['start'])
def start(message):
    cfg = load_config()
    if not cfg.get('password_hash') or not cfg.get('salt'):
        # اولین بار: از کاربر رمز میخواهیم
        msg = bot.reply_to(message, "🔐 خوش آمدید! لطفاً یک رمز عبور برای ربات انتخاب کنید (حداقل 4 کاراکتر):")
        bot.register_next_step_handler(msg, set_first_password)
    else:
        bot.reply_to(message, "🤖 به ربات شخصی خوش آمدید.\nلطفاً با دستور /auth <رمز> وارد شوید.", reply_markup=main_menu_keyboard())

def set_first_password(message):
    password = message.text.strip()
    if len(password) < 4:
        msg = bot.reply_to(message, "رمز باید حداقل 4 کاراکتر باشد. دوباره وارد کنید:")
        bot.register_next_step_handler(msg, set_first_password)
        return
    h, s = hash_password(password)
    cfg = load_config()
    cfg['password_hash'] = h
    cfg['salt'] = s
    cfg['authorized'] = [str(message.chat.id)]
    save_config(cfg)
    bot.reply_to(message, "✅ رمز عبور ذخیره شد. شما اکنون وارد شده‌اید.", reply_markup=main_menu_keyboard())

@bot.message_handler(commands=['auth'])
def auth_command(message):
    parts = message.text.split()
    if len(parts) != 2:
        bot.reply_to(message, "فرمت: /auth <رمز>")
        return
    cfg = load_config()
    if not cfg.get('password_hash') or not cfg.get('salt'):
        bot.reply_to(message, "هنوز رمزی تنظیم نشده. لطفاً ربات را ریستارت کنید.")
        return
    if verify_password(parts[1], cfg['password_hash'], cfg['salt']):
        authorized = cfg.get('authorized', [])
        if str(message.chat.id) not in authorized:
            authorized.append(str(message.chat.id))
            cfg['authorized'] = authorized
            save_config(cfg)
        bot.reply_to(message, "✅ احراز هویت موفق! از منو استفاده کنید.", reply_markup=main_menu_keyboard())
    else:
        bot.reply_to(message, "❌ رمز اشتباه است.")

@bot.message_handler(commands=['change_password'])
@auth_required
def change_password_cmd(message):
    msg = bot.reply_to(message, "رمز عبور جدید را وارد کنید:")
    bot.register_next_step_handler(msg, set_new_password)

def set_new_password(message):
    password = message.text.strip()
    if len(password) < 4:
        msg = bot.reply_to(message, "رمز حداقل 4 کاراکتر. دوباره:")
        bot.register_next_step_handler(msg, set_new_password)
        return
    h, s = hash_password(password)
    cfg = load_config()
    cfg['password_hash'] = h
    cfg['salt'] = s
    save_config(cfg)
    bot.reply_to(message, "✅ رمز با موفقیت تغییر کرد.")

# ================== کالبک‌های اینلاین ==================
@bot.callback_query_handler(func=lambda call: True)
def callback_query(call):
    data = call.data
    chat_id = call.message.chat.id
    if not is_authenticated(chat_id):
        bot.answer_callback_query(call.id, "ابتدا احراز هویت کنید", show_alert=True)
        return

    if data == "browse_telegram":
        # شروع مرور از پوشه telegram ریشه
        user_states[chat_id] = {'state': 'browsing', 'path': 'telegram'}
        show_directory(chat_id, 'telegram')
    elif data == "manage_channels":
        manage_channels_menu(chat_id)
    elif data == "list_workflows":
        list_workflows_menu(chat_id)
    elif data == "change_password":
        bot.send_message(chat_id, "برای تغییر رمز از دستور /change_password استفاده کنید.")
    elif data.startswith("dir:"):
        # ورود به زیرپوشه
        path = data[4:]
        user_states[chat_id] = {'state': 'browsing', 'path': path}
        show_directory(chat_id, path)
    elif data.startswith("file:"):
        # دانلود فایل
        file_path = data[5:]
        download_file(chat_id, file_path)
    elif data.startswith("wf_run:"):
        workflow_id = data[7:]
        if run_workflow(workflow_id):
            bot.answer_callback_query(call.id, "ورکفلو با موفقیت اجرا شد")
        else:
            bot.answer_callback_query(call.id, "خطا در اجرا", show_alert=True)
    elif data.startswith("channel_add"):
        # درخواست نام کانال جدید
        msg = bot.send_message(chat_id, "نام کانال جدید را وارد کنید:")
        bot.register_next_step_handler(msg, add_channel_step)
    elif data.startswith("channel_remove:"):
        channel_name = data[15:]
        channels = get_channels()
        if channel_name in channels:
            del channels[channel_name]
            save_channels(channels)
            # حذف پوشه مربوطه در مسیر telegram
            channel_path = os.path.join(TELEGRAM_ROOT, channel_name)
            if os.path.exists(channel_path):
                import shutil
                shutil.rmtree(channel_path)
            bot.answer_callback_query(call.id, f"کانال {channel_name} حذف شد")
            manage_channels_menu(chat_id)
        else:
            bot.answer_callback_query(call.id, "کانال یافت نشد", show_alert=True)
    elif data.startswith("edit_lastid:"):
        channel_name = data[12:]
        show_edit_lastid(chat_id, channel_name)
    else:
        bot.answer_callback_query(call.id, "دستور نامعتبر")

def show_directory(chat_id, rel_path):
    items = get_file_tree(rel_path)
    if not items:
        bot.send_message(chat_id, "این پوشه خالی است یا وجود ندارد.")
        return
    keyboard = types.InlineKeyboardMarkup(row_width=1)
    for typ, name, full in items:
        if typ == 'dir':
            keyboard.add(types.InlineKeyboardButton(f"📁 {name}", callback_data=f"dir:{full}"))
        else:
            keyboard.add(types.InlineKeyboardButton(f"📄 {name}", callback_data=f"file:{full}"))
    # دکمه بازگشت به منوی اصلی
    keyboard.add(types.InlineKeyboardButton("🔙 منوی اصلی", callback_data="main_menu"))
    bot.send_message(chat_id, f"📂 مسیر: {rel_path}", reply_markup=keyboard)

def download_file(chat_id, file_path):
    full_path = os.path.join(os.path.dirname(BASE_DIR), file_path)
    if not os.path.exists(full_path):
        bot.send_message(chat_id, "فایل وجود ندارد")
        return
    with open(full_path, 'rb') as f:
        bot.send_document(chat_id, f, caption=os.path.basename(file_path))

def manage_channels_menu(chat_id):
    channels = get_channels()
    keyboard = types.InlineKeyboardMarkup(row_width=2)
    for ch in channels:
        keyboard.add(
            types.InlineKeyboardButton(f"❌ حذف {ch}", callback_data=f"channel_remove:{ch}"),
            types.InlineKeyboardButton(f"✏️ ویرایش last_id {ch}", callback_data=f"edit_lastid:{ch}")
        )
    keyboard.add(types.InlineKeyboardButton("➕ افزودن کانال جدید", callback_data="channel_add"))
    keyboard.add(types.InlineKeyboardButton("🔙 منوی اصلی", callback_data="main_menu"))
    bot.send_message(chat_id, "مدیریت کانال‌ها:", reply_markup=keyboard)

def add_channel_step(message):
    channel_name = message.text.strip()
    if not channel_name:
        bot.reply_to(message, "نام نامعتبر")
        return
    channels = get_channels()
    if channel_name in channels:
        bot.reply_to(message, "کانال از قبل وجود دارد")
        return
    # ایجاد پوشه جدید در مسیر telegram
    new_path = os.path.join(TELEGRAM_ROOT, channel_name)
    os.makedirs(new_path, exist_ok=True)
    channels[channel_name] = {"last_id": 0}   # مقدار اولیه
    save_channels(channels)
    bot.reply_to(message, f"کانال {channel_name} اضافه شد.")
    manage_channels_menu(message.chat.id)

def show_edit_lastid(chat_id, channel_name):
    last_data = get_last_id()
    current = last_data.get(channel_name, 0)
    msg = bot.send_message(chat_id, f"مقدار last_id فعلی برای {channel_name}: {current}\nمقدار جدید را وارد کنید (عدد):")
    bot.register_next_step_handler(msg, set_last_id_step, channel_name)

def set_last_id_step(message, channel_name):
    try:
        new_id = int(message.text.strip())
    except:
        bot.reply_to(message, "عدد وارد کنید")
        return
    last_data = get_last_id()
    last_data[channel_name] = new_id
    save_last_id(last_data)
    bot.reply_to(message, f"last_id برای {channel_name} به {new_id} تغییر کرد.")
    manage_channels_menu(message.chat.id)

def list_workflows_menu(chat_id):
    workflows = list_workflows()
    if not workflows:
        bot.send_message(chat_id, "هیچ ورکفلو یافت نشد")
        return
    keyboard = types.InlineKeyboardMarkup(row_width=1)
    for name, wf_id in workflows:
        keyboard.add(types.InlineKeyboardButton(f"▶️ {name}", callback_data=f"wf_run:{wf_id}"))
    keyboard.add(types.InlineKeyboardButton("🔙 منوی اصلی", callback_data="main_menu"))
    bot.send_message(chat_id, "لیست ورکفلوها (با کلیک اجرا می‌شوند):", reply_markup=keyboard)

# منوی اصلی از طریق کالبک
@bot.callback_query_handler(func=lambda call: call.data == "main_menu")
def main_menu_callback(call):
    bot.edit_message_reply_markup(call.message.chat.id, call.message.message_id, reply_markup=main_menu_keyboard())
    bot.answer_callback_query(call.id)

# ================== اجرای ربات ==================
print("✅ ربات آماده است")
bot.infinity_polling()
EOF

      # ---------- فایل requirements ----------
      - name: 📦 Create requirements.txt
        run: |
          cat > bale-bot/requirements.txt << 'EOF'
pyTelegramBotAPI
requests
EOF

      # ---------- فایل README ساده ----------
      - name: 📄 Create README for bot
        run: |
          cat > bale-bot/README.md << 'EOF'
# ربات شخصی بله
قابلیت‌ها:
- مرور فایل‌های پوشه telegram
- مدیریت کانال‌ها (اضافه/حذف و ویرایش last_id)
- اجرای ورکفلوهای گیت‌هاب
- احراز هویت با رمز (هش شده)
EOF

      # ---------- ایجاد فایل sample channels.json و last_id.json اگر وجود نداشت ----------
      - name: 📝 Create initial data files if not exist
        run: |
          cd ..
          if [ ! -f "channels.json" ]; then
            echo '{}' > channels.json
          fi
          if [ ! -f "last_id.json" ]; then
            echo '{}' > last_id.json
          fi
          git add channels.json last_id.json || true
          cd bale-bot

      # ---------- ایجاد ورکفلو زمانبند برای اجرای هر 2 دقیقه ----------
      - name: ⏰ Create scheduler workflow
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/bale_runner.yml << 'EOF'
name: Run Bale Bot every 2 min
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        working-directory: ./bale-bot
        run: pip install -r requirements.txt
      - name: Run bot
        working-directory: ./bale-bot
        env:
          BALE_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 115s python bot.py || true
EOF

      # ---------- مرحله نهایی: commit و push همه چیز ----------
      - name: 📤 Commit and push
        run: |
          git config user.name "Bale Bot Builder"
          git config user.email "bot@github.com"
          git add bale-bot .github/workflows/bale_runner.yml channels.json last_id.json
          git commit -m "✨ ساخت ربات بله با قابلیت‌های کامل (مدیریت فایل، کانال، ورکفلو)" || echo "تغییری نیست"
          git push