name: Bale Bot Complete Manager

on:
  schedule:
    - cron: '*/2 * * * *'  # هر ۲ دقیقه
  workflow_dispatch:        # اجرای دستی

jobs:
  bale-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install requirements
        run: |
          pip install requests python-telegram-bot
          pip install asyncio
      
      - name: Run Bale Bot Manager
        env:
          # بدون نیاز به Secrets - توکن مستقیم
          BALE_TOKEN: "818701126:bddSR_8vTeJWOtpsTXNNeh_WAsMZPignYwk"
        run: |
          cat > /tmp/bot_manager.py << 'EOF'
import os
import json
import requests
from pathlib import Path
import subprocess
from datetime import datetime

BALE_TOKEN = os.environ['BALE_TOKEN']
BASE_URL = f"https://tapi.bale.ai/bot{BALE_TOKEN}"

CHANNELS_FILE = "channels.json"
LAST_ID_FILE = "last_id.json"
TELEGRAM_DATA_PATH = "TelegramData"

# ========== کلاس مدیریت فایل‌ها ==========
class FileManager:
    @staticmethod
    def list_path(path):
        """لیست محتویات یک پوشه"""
        full_path = Path(path)
        if not full_path.exists():
            full_path.mkdir(parents=True, exist_ok=True)
            return []
        
        items = []
        for item in sorted(full_path.iterdir()):
            items.append({
                "name": item.name,
                "type": "📁" if item.is_dir() else "📄",
                "path": str(item.absolute()),
                "size": item.stat().st_size if item.is_file() else 0
            })
        return items
    
    @staticmethod
    def get_file_content(file_path):
        """خواندن محتوای فایل متنی"""
        try:
            with open(file_path, 'r', encoding='utf-8') as f:
                return f.read()
        except:
            return "خطا در خواندن فایل"

# ========== کلاس مدیریت کانال‌ها ==========
class ChannelManager:
    @staticmethod
    def load():
        if not os.path.exists(CHANNELS_FILE):
            default = {"channels": ["پیشفرض"]}
            with open(CHANNELS_FILE, 'w') as f:
                json.dump(default, f, indent=4, ensure_ascii=False)
            return default
        with open(CHANNELS_FILE, 'r', encoding='utf-8') as f:
            return json.load(f)
    
    @staticmethod
    def save(data):
        with open(CHANNELS_FILE, 'w', encoding='utf-8') as f:
            json.dump(data, f, indent=4, ensure_ascii=False)
        # ساخت پوشه برای هر کانال
        for channel in data['channels']:
            Path(f"{TELEGRAM_DATA_PATH}/{channel}").mkdir(parents=True, exist_ok=True)

# ========== کلاس مدیریت Last IDs ==========
class LastIDManager:
    @staticmethod
    def load():
        if not os.path.exists(LAST_ID_FILE):
            default = {"last_ids": {}}
            with open(LAST_ID_FILE, 'w') as f:
                json.dump(default, f)
            return default
        with open(LAST_ID_FILE, 'r') as f:
            return json.load(f)
    
    @staticmethod
    def save(data):
        with open(LAST_ID_FILE, 'w') as f:
            json.dump(data, f, indent=4)

# ========== کلاس مدیریت GitHub Workflow ==========
class WorkflowManager:
    @staticmethod
    def list_workflows():
        """لیست ورک‌فلوهای موجود در مخزن"""
        workflows_path = Path(".github/workflows")
        if not workflows_path.exists():
            return []
        
        workflows = []
        for yaml_file in workflows_path.glob("*.yml"):
            workflows.append({
                "name": yaml_file.name,
                "path": str(yaml_file)
            })
        return workflows
    
    @staticmethod
    def run_workflow(workflow_name):
        """اجرای یک ورک‌فلو با استفاده از git push"""
        # ایجاد یک فایل موقتی برای trigger کردن
        trigger_file = f".trigger_{datetime.now().timestamp()}"
        Path(trigger_file).touch()
        
        # Commit و push کردن
        subprocess.run(["git", "config", "user.name", "Bot Manager"])
        subprocess.run(["git", "config", "user.email", "bot@local"])
        subprocess.run(["git", "add", trigger_file])
        subprocess.run(["git", "commit", "-m", f"Trigger {workflow_name}"])
        subprocess.run(["git", "push"])
        
        # پاک کردن فایل trigger
        Path(trigger_file).unlink()
        return True

# ========== ارسال پیام به بله ==========
def send_message(chat_id, text, keyboard=None):
    """ارسال پیام به بله"""
    url = f"{BASE_URL}/sendMessage"
    data = {
        "chat_id": chat_id,
        "text": text,
        "parse_mode": "HTML"
    }
    if keyboard:
        data["reply_markup"] = json.dumps(keyboard)
    
    try:
        response = requests.post(url, json=data, timeout=10)
        return response.json()
    except Exception as e:
        print(f"Error: {e}")
        return None

# ========== ساخت کیبورد شیشه‌ای ==========
def create_folder_keyboard(current_path):
    """ساخت کیبورد برای نمایش فایل‌ها و پوشه‌ها"""
    items = FileManager.list_path(current_path)
    keyboard = []
    
    # دکمه بازگشت به بالا
    if current_path != TELEGRAM_DATA_PATH:
        parent_path = str(Path(current_path).parent)
        keyboard.append([{"text": "🔙 بازگشت", "callback_data": f"browse:{parent_path}"}])
    
    # دکمه‌های فایل‌ها و پوشه‌ها (به صورت ستونی)
    row = []
    for item in items:
        cb_data = f"browse:{item['path']}" if item['type'] == "📁" else f"view:{item['path']}"
        row.append({"text": f"{item['type']} {item['name']}", "callback_data": cb_data})
        
        if len(row) == 2:  # هر سطر ۲ دکمه
            keyboard.append(row)
            row = []
    if row:
        keyboard.append(row)
    
    # دکمه‌های اصلی
    keyboard.append([{"text": "🏠 صفحه اصلی", "callback_data": "main_menu"}])
    
    return {"inline_keyboard": keyboard}

# ========== پردازش درخواست‌ها ==========
def process_update(update):
    """پردازش پیام‌ها و callbackها"""
    if 'message' in update:
        chat_id = update['message']['chat']['id']
        text = update['message'].get('text', '')
        
        if text == '/start':
            keyboard = {
                "inline_keyboard": [
                    [{"text": "📁 مدیریت فایل‌ها", "callback_data": "files_menu"}],
                    [{"text": "📺 مدیریت کانال‌ها", "callback_data": "channels_menu"}],
                    [{"text": "🆔 مدیریت Last IDs", "callback_data": "lastids_menu"}],
                    [{"text": "⚙️ مدیریت Workflow‌ها", "callback_data": "workflows_menu"}],
                    [{"text": "📊 وضعیت سیستم", "callback_data": "status"}]
                ]
            }
            send_message(chat_id, "🤖 <b>به ربات مدیریت خوش آمدید</b>\n\nیک گزینه را انتخاب کنید:", keyboard)
        
        elif text == '/status':
            show_status(chat_id)
    
    elif 'callback_query' in update:
        chat_id = update['callback_query']['message']['chat']['id']
        data = update['callback_query']['data']
        
        if data == "main_menu":
            # بازگشت به منوی اصلی
            process_update({'message': {'chat': {'id': chat_id}, 'text': '/start'}})
        
        elif data == "files_menu":
            # نمایش لیست فایل‌ها و پوشه‌ها
            items = FileManager.list_path(TELEGRAM_DATA_PATH)
            if not items:
                send_message(chat_id, "📂 هیچ فایل یا پوشه‌ای یافت نشد")
            else:
                keyboard = create_folder_keyboard(TELEGRAM_DATA_PATH)
                text = "📂 <b>مدیریت فایل‌ها</b>\n\nبرای مشاهده محتوا روی هر گزینه کلیک کنید:"
                send_message(chat_id, text, keyboard)
        
        elif data.startswith("browse:"):
            # مرور یک پوشه
            path = data.replace("browse:", "")
            keyboard = create_folder_keyboard(path)
            folder_name = Path(path).name
            send_message(chat_id, f"📁 <b>{folder_name}</b>\n\nمحتویات پوشه:", keyboard)
        
        elif data.startswith("view:"):
            # مشاهده محتوای فایل
            file_path = data.replace("view:", "")
            content = FileManager.get_file_content(file_path)
            # محدود کردن طول پیام
            if len(content) > 4000:
                content = content[:4000] + "\n\n... (ادامه مطلب حذف شد)"
            send_message(chat_id, f"<b>📄 {Path(file_path).name}</b>\n\n<code>{content}</code>")
        
        elif data == "channels_menu":
            # منوی مدیریت کانال‌ها
            channels = ChannelManager.load()
            text = "📺 <b>مدیریت کانال‌ها</b>\n\nلیست کانال‌های فعلی:\n"
            for idx, ch in enumerate(channels['channels'], 1):
                text += f"{idx}. {ch}\n"
            
            keyboard = {
                "inline_keyboard": [
                    [{"text": "➕ افزودن کانال جدید", "callback_data": "add_channel"}],
                    [{"text": "❌ حذف کانال", "callback_data": "remove_channel"}],
                    [{"text": "🏠 بازگشت", "callback_data": "main_menu"}]
                ]
            }
            send_message(chat_id, text, keyboard)
        
        elif data == "add_channel":
            send_message(chat_id, "نام کانال جدید را وارد کنید:")
            # ذخیره در memory که کاربر در حالت افزودن است
            # (برای simplicity، اینجا توضیح داده می‌شود)
        
        elif data == "lastids_menu":
            # نمایش last_ids
            last_ids = LastIDManager.load()
            text = "🆔 <b>Last IDs فعلی</b>\n\n"
            for channel, last_id in last_ids['last_ids'].items():
                text += f"• {channel}: {last_id}\n"
            
            keyboard = {
                "inline_keyboard": [
                    [{"text": "✏️ ویرایش", "callback_data": "edit_lastids"}],
                    [{"text": "🏠 بازگشت", "callback_data": "main_menu"}]
                ]
            }
            send_message(chat_id, text, keyboard)
        
        elif data == "workflows_menu":
            # نمایش لیست workflowها
            workflows = WorkflowManager.list_workflows()
            if not workflows:
                send_message(chat_id, "⚙️ هیچ ورک‌فلو دیگری یافت نشد")
                return
            
            keyboard = []
            for wf in workflows:
                keyboard.append([{"text": f"▶️ {wf['name']}", "callback_data": f"run:{wf['name']}"}])
            keyboard.append([{"text": "🏠 بازگشت", "callback_data": "main_menu"}])
            
            send_message(chat_id, "⚙️ <b>لیست ورک‌فلوهای قابل اجرا</b>\n\nروی هر کدام کلیک کنید تا اجرا شود:", 
                        {"inline_keyboard": keyboard})
        
        elif data.startswith("run:"):
            workflow_name = data.replace("run:", "")
            result = WorkflowManager.run_workflow(workflow_name)
            if result:
                send_message(chat_id, f"✅ ورک‌فلو <b>{workflow_name}</b> با موفقیت اجرا شد")
            else:
                send_message(chat_id, f"❌ خطا در اجرای {workflow_name}")
        
        elif data == "status":
            show_status(chat_id)

def show_status(chat_id):
    """نمایش وضعیت سیستم"""
    # اطلاعات مخزن
    repo_url = "https://github.com/ehsan-golshani/aio-downloader-ehsan"
    
    # اطلاعات فایل‌ها
    channels = ChannelManager.load()
    last_ids = LastIDManager.load()
    
    text = f"""
📊 <b>وضعیت سیستم</b>

📁 <b>اطلاعات مخزن:</b>
• {repo_url}

📺 <b>کانال‌ها:</b>
• تعداد: {len(channels['channels'])}
• لیست: {', '.join(channels['channels']) if channels['channels'] else 'خالی'}

🆔 <b>Last IDs ذخیره شده:</b>
• تعداد: {len(last_ids['last_ids'])}

⚙️ <b>ورک‌فلوها:</b>
• پوشه workflows: {'وجود دارد' if Path('.github/workflows').exists() else 'خالی'}

🕐 <b>آخرین بروزرسانی:</b>
• {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}
    """
    
    send_message(chat_id, text)

# ========== حلقه اصلی ==========
def main():
    print("🤖 Bale Bot Manager Started")
    
    offset = 0
    while True:
        try:
            # دریافت آپدیت‌ها
            url = f"{BASE_URL}/getUpdates"
            response = requests.get(url, params={"offset": offset, "timeout": 30}, timeout=35)
            
            if response.status_code == 200:
                updates = response.json()
                for update in updates.get('result', []):
                    process_update(update)
                    offset = update['update_id'] + 1
            else:
                print(f"Error: {response.status_code}")
        
        except Exception as e:
            print(f"Error in main loop: {e}")
        
        # هر ۲ دقیقه یکبار اجرا می‌شود (عملاً در اینجا یکبار اجرا می‌شود)
        break  # خارج شدن از حلقه چون فقط یکبار در هر run اکشن اجرا می‌شود

if __name__ == "__main__":
    # اطمینان از وجود پوشه‌های مورد نیاز
    Path(TELEGRAM_DATA_PATH).mkdir(exist_ok=True)
    Path(".github/workflows").mkdir(parents=True, exist_ok=True)
    
    # ایجاد فایل‌های پیش‌فرض اگر وجود ندارند
    ChannelManager.save(ChannelManager.load())
    LastIDManager.save(LastIDManager.load())
    
    main()
