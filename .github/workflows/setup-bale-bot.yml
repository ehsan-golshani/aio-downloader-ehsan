@bot.message_handler(commands=['status'])
@auth_required
def show_status(message):
    """وضعیت سیستم"""
    # آمار پوشه telegram
    telegram_size = 0
    telegram_count = 0
    if os.path.exists(TELEGRAM_DIR):
        for root, dirs, files in os.walk(TELEGRAM_DIR):
            telegram_count += len(files)
            for f in files:
                telegram_size += os.path.getsize(os.path.join(root, f))
    
    # کانال‌ها
    channels = []
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            data = json.load(f)
            channels = data.get('channels', [])
    
    status = f"""
📊 **وضعیت ربات**

🔐 **احراز هویت:** {'✅ فعال' if os.path.exists(PASSWORD_FILE) else '❌ تنظیم نشده'}
👤 **کاربران مجاز:** {len(authorized_users)}

📁 **پوشه telegram:**
• فایل‌ها: {telegram_count} عدد
• حجم کل: {telegram_size/(1024*1024):.2f} MB

📺 **کانال‌ها:** {len(channels)} عدد

🚀 **ورکفلوها:** {len([f for f in os.listdir(WORKFLOWS_DIR) if f.endswith(('.yml','.yaml'))]) if os.path.exists(WORKFLOWS_DIR) else 0} عدد

⏱ **زمان اجرا:** هر ۲ دقیقه یکبار
"""
    bot.reply_to(message, status, parse_mode='Markdown')

print("✅ ربات راه‌اندازی شد!")
load_authorized()
bot.infinity_polling()
