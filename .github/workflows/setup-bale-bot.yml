name: 🎯 ساخت ربات نهایی بله

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'توکن ربات بله (از @BotFather بگیر)'
        required: true
        type: string
      bot_password:
        description: 'رمز عبور دلخواه (فقط خودت بدونی)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 دریافت مخزن
        uses: actions/checkout@v4

      - name: 🗑️ حذف پوشه قبلی bale-bot (اگر وجود داشته)
        run: |
          rm -rf bale-bot
          echo "✅ پوشه قبلی حذف شد"

      - name: 🔐 ساخت هش رمز عبور (غیرقابل دیکد)
        env:
          RAW_PASSWORD: ${{ github.event.inputs.bot_password }}
        run: |
          SALT=$(openssl rand -hex 32)
          HASH=$(echo -n "$RAW_PASSWORD$SALT" | openssl dgst -sha256 -hex | cut -d' ' -f2)
          
          echo "SALT=$SALT" >> $GITHUB_ENV
          echo "HASH=$HASH" >> $GITHUB_ENV
          
          # فایل رمز هش‌شده (امن)
          mkdir -p .bot-secrets
          echo "{\"hash\":\"$HASH\", \"salt\":\"$SALT\"}" > .bot-secrets/password.json
          echo "✅ رمز عبور هش شد (هیچکس نمی‌تونه برگردونه)"

      - name: 🤖 ساخت فایل‌های ربات
        env:
          TOKEN: ${{ github.event.inputs.bot_token }}
        run: |
          # ایجاد پوشه ربات
          mkdir -p bale-bot
          
          # requirements
          cat > bale-bot/requirements.txt << 'EOF'
          pyTelegramBotAPI
          requests
          EOF
          
          # فایل اصلی ربات (با تمام قابلیت‌ها)
          cat > bale-bot/bot.py << 'BOT'
import telebot
import os
import json
import glob
import hashlib
from telebot import api
from telebot.types import InlineKeyboardMarkup, InlineKeyboardButton

# تنظیم endpoint بله
api.TELEGRAM_API_URL = 'https://tapi.bale.ai/bot{0}/{1}'

TOKEN = os.environ.get('BALE_TOKEN')
if not TOKEN:
    raise Exception("توکن یافت نشد")

bot = telebot.TeleBot(TOKEN)

# مسیرها
REPO_ROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
TELEGRAM_DIR = os.path.join(REPO_ROOT, 'telegram')
SECRETS_DIR = os.path.join(REPO_ROOT, '.bot-secrets')
AUTH_FILE = os.path.join(SECRETS_DIR, 'authorized.json')
CHANNELS_FILE = os.path.join(TELEGRAM_DIR, 'channels.json')

# بارگذاری رمز هش شده
with open(os.path.join(SECRETS_DIR, 'password.json'), 'r') as f:
    pwd_data = json.load(f)
    REQUIRED_HASH = pwd_data['hash']
    SALT = pwd_data['salt']

def verify_password(pwd):
    return hashlib.sha256((pwd + SALT).encode()).hexdigest() == REQUIRED_HASH

# مدیریت کاربران مجاز
def load_auth():
    try:
        with open(AUTH_FILE, 'r') as f:
            return set(json.load(f).get('users', []))
    except:
        return set()

def save_auth(users):
    with open(AUTH_FILE, 'w') as f:
        json.dump({'users': list(users)}, f)

authorized = load_auth()

def auth_required(func):
    def wrapper(m):
        if str(m.chat.id) in authorized:
            return func(m)
        else:
            bot.reply_to(m, "🔒 ابتدا احراز هویت کن: /auth <رمز>")
    return wrapper

# ========== منوی اصلی ==========
def main_menu():
    kb = InlineKeyboardMarkup()
    kb.add(InlineKeyboardButton("📁 فایل‌های تلگرام", callback_data="menu_files"))
    kb.add(InlineKeyboardButton("⚙️ ورکفلوها", callback_data="menu_workflows"))
    kb.add(InlineKeyboardButton("📋 مدیریت کانال‌ها", callback_data="menu_channels"))
    kb.add(InlineKeyboardButton("🔄 وضعیت", callback_data="menu_status"))
    return kb

# ========== 1. مدیریت فایل‌های تلگرام (درخت پوشه) ==========
def get_folder_tree(path, level=0):
    """دریافت درخت پوشه به صورت دکمه‌ای"""
    if not os.path.exists(path):
        return []
    items = []
    for item in sorted(os.listdir(path)):
        full = os.path.join(path, item)
        if os.path.isdir(full):
            items.append(('📁 ' + item, 'dir_' + full))
        else:
            size = os.path.getsize(full)
            size_str = f"{size/1024:.1f}KB" if size < 1024*1024 else f"{size/(1024*1024):.1f}MB"
            items.append(('📄 ' + item + f' ({size_str})', 'file_' + full))
    return items

@bot.callback_query_handler(func=lambda call: call.data.startswith('files_'))
def handle_files_browser(call):
    path = call.data[6:]
    if path == 'ROOT':
        path = TELEGRAM_DIR
    
    if not os.path.exists(path):
        bot.edit_message_text("❌ پوشه وجود ندارد", call.message.chat.id, call.message.message_id)
        return
    
    items = get_folder_tree(path)
    kb = InlineKeyboardMarkup()
    for name, data in items:
        kb.add(InlineKeyboardButton(name, callback_data=data))
    
    # دکمه بازگشت
    parent = os.path.dirname(path)
    if parent != TELEGRAM_DIR and parent != path:
        kb.add(InlineKeyboardButton("🔙 بازگشت", callback_data=f"files_{parent}"))
    kb.add(InlineKeyboardButton("🏠 منوی اصلی", callback_data="main_menu"))
    
    bot.edit_message_text(f"📂 مسیر: {path.replace(TELEGRAM_DIR, '') or '/'}", 
                          call.message.chat.id, call.message.message_id, reply_markup=kb)

@bot.callback_query_handler(func=lambda call: call.data.startswith('file_'))
def handle_file_download(call):
    filepath = call.data[5:]
    if os.path.exists(filepath):
        with open(filepath, 'rb') as f:
            bot.send_document(call.message.chat.id, f, caption=os.path.basename(filepath))
        bot.answer_callback_query(call.id, "✅ فایل ارسال شد")
    else:
        bot.answer_callback_query(call.id, "❌ فایل وجود ندارد", show_alert=True)

@bot.callback_query_handler(func=lambda call: call.data.startswith('dir_'))
def handle_dir_open(call):
    path = call.data[4:]
    items = get_folder_tree(path)
    kb = InlineKeyboardMarkup()
    for name, data in items:
        kb.add(InlineKeyboardButton(name, callback_data=data))
    parent = os.path.dirname(path)
    kb.add(InlineKeyboardButton("🔙 بازگشت", callback_data=f"files_{parent}"))
    kb.add(InlineKeyboardButton("🏠 منوی اصلی", callback_data="main_menu"))
    bot.edit_message_text(f"📂 {path.replace(TELEGRAM_DIR, '')}", 
                          call.message.chat.id, call.message.message_id, reply_markup=kb)

# ========== 2. مدیریت ورکفلوها با GitHub API ==========
@bot.callback_query_handler(func=lambda call: call.data == 'menu_workflows')
def workflows_menu(call):
    kb = InlineKeyboardMarkup()
    kb.add(InlineKeyboardButton("🔄 لیست ورکفلوها", callback_data="list_workflows"))
    kb.add(InlineKeyboardButton("🏠 منوی اصلی", callback_data="main_menu"))
    bot.edit_message_text("⚙️ مدیریت ورکفلوهای گیت‌هاب:", 
                          call.message.chat.id, call.message.message_id, reply_markup=kb)

@bot.callback_query_handler(func=lambda call: call.data == 'list_workflows')
def list_workflows(call):
    # اینجا می‌تونیم از API گیت‌هاب استفاده کنیم
    workflows_dir = os.path.join(REPO_ROOT, '.github/workflows')
    if os.path.exists(workflows_dir):
        wfs = [f.replace('.yml', '') for f in os.listdir(workflows_dir) if f.endswith('.yml')]
        kb = InlineKeyboardMarkup()
        for wf in wfs:
            kb.add(InlineKeyboardButton(f"▶️ {wf}", callback_data=f"run_{wf}"))
        kb.add(InlineKeyboardButton("🔙 برگشت", callback_data="menu_workflows"))
        bot.edit_message_text("📋 ورکفلوهای موجود:", 
                              call.message.chat.id, call.message.message_id, reply_markup=kb)
    else:
        bot.answer_callback_query(call.id, "هیچ ورکفلو یافت نشد", show_alert=True)

@bot.callback_query_handler(func=lambda call: call.data.startswith('run_'))
def run_workflow(call):
    wf_name = call.data[4:]
    # استفاده از GitHub API برای اجرا نیاز به توکن دارد
    # در اینجا پیام می‌دیم که قابلیت در حال توسعه
    bot.answer_callback_query(call.id, f"اجرای {wf_name} - در حال توسعه", show_alert=True)

# ========== 3. مدیریت کانال‌ها (فایل channels.json) ==========
@bot.callback_query_handler(func=lambda call: call.data == 'menu_channels')
def channels_menu(call):
    kb = InlineKeyboardMarkup()
    kb.add(InlineKeyboardButton("📋 لیست کانال‌ها", callback_data="list_channels"))
    kb.add(InlineKeyboardButton("➕ اضافه کردن کانال", callback_data="add_channel"))
    kb.add(InlineKeyboardButton("➖ حذف کانال", callback_data="remove_channel"))
    kb.add(InlineKeyboardButton("🏠 منوی اصلی", callback_data="main_menu"))
    bot.edit_message_text("📋 مدیریت کانال‌ها:", 
                          call.message.chat.id, call.message.message_id, reply_markup=kb)

@bot.callback_query_handler(func=lambda call: call.data == 'list_channels')
def list_channels(call):
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            channels = json.load(f)
        text = "📋 لیست کانال‌ها:\n" + "\n".join([f"- {ch}" for ch in channels.get('channels', [])])
    else:
        text = "هیچ کانالی تعریف نشده"
    bot.edit_message_text(text, call.message.chat.id, call.message.message_id, 
                          reply_markup=InlineKeyboardMarkup().add(
                              InlineKeyboardButton("🔙 برگشت", callback_data="menu_channels")))

@bot.callback_query_handler(func=lambda call: call.data == 'add_channel')
def ask_channel_name(call):
    msg = bot.send_message(call.message.chat.id, "نام کانال رو بفرست:")
    bot.register_next_step_handler(msg, save_channel)

def save_channel(m):
    channel_name = m.text.strip()
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            data = json.load(f)
    else:
        data = {'channels': []}
    
    if channel_name not in data['channels']:
        data['channels'].append(channel_name)
        with open(CHANNELS_FILE, 'w') as f:
            json.dump(data, f, indent=2)
        
        # ایجاد پوشه کانال
        channel_dir = os.path.join(TELEGRAM_DIR, channel_name)
        os.makedirs(os.path.join(channel_dir, 'data'), exist_ok=True)
        os.makedirs(os.path.join(channel_dir, 'pages'), exist_ok=True)
        
        bot.reply_to(m, f"✅ کانال {channel_name} اضافه شد")
    else:
        bot.reply_to(m, "❌ کانال قبلاً وجود دارد")
    
    # برگشت به منو
    channels_menu(m)

@bot.callback_query_handler(func=lambda call: call.data == 'remove_channel')
def ask_remove_channel(call):
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            channels = json.load(f).get('channels', [])
        
        kb = InlineKeyboardMarkup()
        for ch in channels:
            kb.add(InlineKeyboardButton(f"❌ {ch}", callback_data=f"del_{ch}"))
        kb.add(InlineKeyboardButton("🔙 برگشت", callback_data="menu_channels"))
        bot.edit_message_text("کانال رو برای حذف انتخاب کن:", 
                              call.message.chat.id, call.message.message_id, reply_markup=kb)

@bot.callback_query_handler(func=lambda call: call.data.startswith('del_'))
def delete_channel(call):
    ch_name = call.data[4:]
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            data = json.load(f)
        if ch_name in data['channels']:
            data['channels'].remove(ch_name)
            with open(CHANNELS_FILE, 'w') as f:
                json.dump(data, f, indent=2)
            
            # حذف پوشه کانال
            import shutil
            ch_dir = os.path.join(TELEGRAM_DIR, ch_name)
            if os.path.exists(ch_dir):
                shutil.rmtree(ch_dir)
            
            bot.answer_callback_query(call.id, f"کانال {ch_name} حذف شد", show_alert=True)
        else:
            bot.answer_callback_query(call.id, "کانال یافت نشد", show_alert=True)
    
    # به‌روزرسانی منو
    channels_menu(call)

# ========== وضعیت ==========
@bot.callback_query_handler(func=lambda call: call.data == 'menu_status')
def show_status(call):
    # آمار پوشه تلگرام
    total_size = 0
    total_files = 0
    if os.path.exists(TELEGRAM_DIR):
        for root, dirs, files in os.walk(TELEGRAM_DIR):
            total_files += len(files)
            for f in files:
                total_size += os.path.getsize(os.path.join(root, f))
    
    size_mb = total_size / (1024*1024)
    status_text = f"""
📊 **وضعیت ربات**

🔐 کاربر مجاز: {str(call.message.chat.id) in authorized}
📁 فایل‌های تلگرام: {total_files} فایل ({size_mb:.1f} MB)
📂 پوشه کانال‌ها: {len(os.listdir(TELEGRAM_DIR)) if os.path.exists(TELEGRAM_DIR) else 0}
⚙️ آخرین بروزرسانی: همین الان
"""
    kb = InlineKeyboardMarkup()
    kb.add(InlineKeyboardButton("🔄 بروزرسانی", callback_data="menu_status"))
    kb.add(InlineKeyboardButton("🏠 منوی اصلی", callback_data="main_menu"))
    bot.edit_message_text(status_text, call.message.chat.id, call.message.message_id, 
                          parse_mode='Markdown', reply_markup=kb)

# ========== منوی اصلی ==========
@bot.callback_query_handler(func=lambda call: call.data == 'main_menu')
def back_to_main(call):
    bot.edit_message_text("🤖 **منوی اصلی ربات بله**\nلطفاً یکی از گزینه‌ها رو انتخاب کن:", 
                          call.message.chat.id, call.message.message_id, 
                          parse_mode='Markdown', reply_markup=main_menu())

# ========== دستورات متنی ==========
@bot.message_handler(commands=['start'])
def start(m):
    bot.send_message(m.chat.id, 
                     "🔐 **به ربات شخصی خوش آمدی**\n\nلطفاً ابتدا احراز هویت کن:\n`/auth <رمز>`\n\nسپس از دکمه‌ها استفاده کن.",
                     parse_mode='Markdown', reply_markup=main_menu())

@bot.message_handler(commands=['auth'])
def auth(m):
    parts = m.text.split()
    if len(parts) != 2:
        bot.reply_to(m, "❌ فرمت: /auth <رمز>")
        return
    if verify_password(parts[1]):
        authorized.add(str(m.chat.id))
        save_auth(authorized)
        bot.reply_to(m, "✅ احراز هویت شد! حالا از دکمه‌ها استفاده کن.", reply_markup=main_menu())
    else:
        bot.reply_to(m, "❌ رمز اشتباه است")

@bot.message_handler(func=lambda m: True)
def unknown(m):
    if str(m.chat.id) in authorized:
        bot.reply_to(m, "از دکمه‌های پایین استفاده کن 👇", reply_markup=main_menu())
    else:
        bot.reply_to(m, "🔒 ابتدا احراز هویت کن: /auth <رمز>")

# اجرای ربات
print("✅ ربات بله روشن شد")
bot.infinity_polling()
