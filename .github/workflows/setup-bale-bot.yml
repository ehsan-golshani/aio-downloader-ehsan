name: Build Complete Bale Bot

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: 'توکن ربات بله (از @BotFather)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: حذف پوشه قدیمی bale-bot
        run: |
          rm -rf bale-bot
          echo "✅ پوشه قدیمی حذف شد"
      
      - name: ایجاد ساختار جدید
        env:
          TOKEN: ${{ github.event.inputs.bot_token }}
        run: |
          # ایجاد پوشه اصلی
          mkdir -p bale-bot
          cd bale-bot
          
          # فایل اصلی ربات
          cat > bot.py << 'BOT'
#!/usr/bin/env python3
import telebot
import os
import sys
import json
import hashlib
import subprocess
import requests
from telebot import types
from telebot import api

# تنظیم endpoint بله
api.TELEGRAM_API_URL = 'https://tapi.bale.ai/bot{0}/{1}'

# مسیرها
BOT_DIR = os.path.dirname(os.path.abspath(__file__))
REPO_ROOT = os.path.dirname(BOT_DIR)
TELEGRAM_DIR = os.path.join(REPO_ROOT, 'telegram')
CHANNELS_FILE = os.path.join(REPO_ROOT, 'channels.json')
LAST_ID_FILE = os.path.join(REPO_ROOT, 'last_id.txt')
WORKFLOWS_DIR = os.path.join(REPO_ROOT, '.github/workflows')

# فایل رمز
PASSWORD_FILE = os.path.join(BOT_DIR, 'password_hash.json')
AUTH_FILE = os.path.join(BOT_DIR, 'authorized.json')

# توکن ربات
TOKEN = "${{ github.event.inputs.bot_token }}"
bot = telebot.TeleBot(TOKEN)

# کاربران مجاز
authorized_users = set()

def load_authorized():
    global authorized_users
    try:
        if os.path.exists(AUTH_FILE):
            with open(AUTH_FILE, 'r') as f:
                data = json.load(f)
                authorized_users = set(data.get('users', []))
    except:
        pass

def save_authorized():
    with open(AUTH_FILE, 'w') as f:
        json.dump({'users': list(authorized_users)}, f)

def is_authorized(user_id):
    return str(user_id) in authorized_users

def auth_required(func):
    def wrapper(message):
        if is_authorized(message.chat.id):
            return func(message)
        else:
            bot.reply_to(message, "🔒 **دسترسی محدود!**\n\nلطفاً ابتدا رمز عبور را تنظیم کنید:\n`/setup <رمز جدید>`", parse_mode='Markdown')
    return wrapper

def verify_password(input_password, saved_hash, salt):
    """تأیید رمز با هش"""
    test_hash = hashlib.pbkdf2_hmac('sha256', input_password.encode(), salt.encode(), 100000).hex()
    return test_hash == saved_hash

@bot.message_handler(commands=['start'])
def start(message):
    welcome = """
🤖 **ربات مدیریت مخزن گیت‌هاب**

سلام! این ربات به شما امکان می‌دهد:

📁 **مدیریت فایل‌ها**
• مرور پوشه `telegram/` و زیرپوشه‌ها
• دانلود فایل‌های دلخواه
• مشاهده ساختار کانال‌ها

⚙️ **مدیریت کانال‌ها**
• مشاهده لیست کانال‌های فعال
• اضافه کردن کانال جدید
• حذف کانال

🚀 **مدیریت ورکفلوها**
• مشاهده لیست ورکفلوها
• اجرای دستی ورکفلوها

📊 **اطلاعات**
• مشاهده آخرین ID
• تغییر last_id

⚠️ **نکته امنیتی:** این ربات شخصی است. ابتدا رمز عبور خود را با دستور `/setup` تنظیم کنید.
"""
    bot.reply_to(message, welcome, parse_mode='Markdown')

@bot.message_handler(commands=['setup'])
def setup_password(message):
    """تنظیم رمز عبور اولیه"""
    parts = message.text.split()
    if len(parts) != 2:
        bot.reply_to(message, "❌ **فرمت صحیح:**\n`/setup <رمز عبور جدید>`", parse_mode='Markdown')
        return
    
    new_password = parts[1]
    
    # تولید salt و هش
    import secrets
    salt = secrets.token_hex(32)
    hash_value = hashlib.pbkdf2_hmac('sha256', new_password.encode(), salt.encode(), 100000).hex()
    
    # ذخیره هش
    with open(PASSWORD_FILE, 'w') as f:
        json.dump({'hash': hash_value, 'salt': salt}, f)
    
    # اضافه کردن کاربر فعلی به مجازها
    authorized_users.add(str(message.chat.id))
    save_authorized()
    
    bot.reply_to(message, "✅ **رمز عبور با موفقیت تنظیم شد!**\n\nاکنون می‌توانید از ربات استفاده کنید.\nبرای راهنمایی: `/help`", parse_mode='Markdown')

@bot.message_handler(commands=['auth'])
def authenticate(message):
    """احراز هویت با رمز"""
    # بررسی وجود فایل رمز
    if not os.path.exists(PASSWORD_FILE):
        bot.reply_to(message, "⚠️ **رمز عبور تنظیم نشده است!**\nلطفاً ابتدا با دستور `/setup <رمز>` رمز خود را تنظیم کنید.", parse_mode='Markdown')
        return
    
    parts = message.text.split()
    if len(parts) != 2:
        bot.reply_to(message, "❌ **فرمت صحیح:**\n`/auth <رمز عبور>`", parse_mode='Markdown')
        return
    
    with open(PASSWORD_FILE, 'r') as f:
        data = json.load(f)
    
    if verify_password(parts[1], data['hash'], data['salt']):
        authorized_users.add(str(message.chat.id))
        save_authorized()
        bot.reply_to(message, "✅ **احراز هویت موفق!**\nاکنون به همه دستورات دسترسی دارید.", parse_mode='Markdown')
    else:
        bot.reply_to(message, "❌ **رمز عبور اشتباه است!**", parse_mode='Markdown')

@bot.message_handler(commands=['browse'])
@auth_required
def browse_files(message):
    """مرور پوشه telegram"""
    markup = types.InlineKeyboardMarkup(row_width=1)
    
    # دکمه بازگشت به ریشه
    btn_root = types.InlineKeyboardButton("📁 ریشه (telegram/)", callback_data="browse_root")
    markup.add(btn_root)
    
    # لیست پوشه‌های داخل telegram (کانال‌ها)
    if os.path.exists(TELEGRAM_DIR):
        for item in sorted(os.listdir(TELEGRAM_DIR)):
            item_path = os.path.join(TELEGRAM_DIR, item)
            if os.path.isdir(item_path):
                btn = types.InlineKeyboardButton(f"📂 {item}", callback_data=f"browse_{item}")
                markup.add(btn)
    
    bot.reply_to(message, "📁 **مرور پوشه telegram/**\n\nپوشه‌های زیر معادل نام کانال‌ها هستند:", reply_markup=markup, parse_mode='Markdown')

@bot.callback_query_handler(func=lambda call: call.data.startswith('browse_'))
def handle_browse(call):
    path_parts = call.data.split('_')[1:]
    
    if path_parts[0] == 'root':
        current_path = TELEGRAM_DIR
        display_path = "telegram/"
    else:
        # ساخت مسیر کامل
        rel_path = '/'.join(path_parts)
        current_path = os.path.join(TELEGRAM_DIR, rel_path)
        display_path = f"telegram/{rel_path}"
    
    if not os.path.exists(current_path):
        bot.answer_callback_query(call.id, "مسیر وجود ندارد")
        return
    
    markup = types.InlineKeyboardMarkup(row_width=1)
    
    # دکمه بازگشت
    parent = '/'.join(path_parts[:-1]) if len(path_parts) > 1 else 'root'
    back_btn = types.InlineKeyboardButton("🔙 بازگشت", callback_data=f"browse_{parent}")
    markup.add(back_btn)
    
    items = sorted(os.listdir(current_path))
    has_items = False
    
    for item in items:
        item_path = os.path.join(current_path, item)
        if os.path.isdir(item_path):
            new_path = f"{rel_path}/{item}" if rel_path != 'root' else item
            btn = types.InlineKeyboardButton(f"📂 {item}", callback_data=f"browse_{new_path}")
            markup.add(btn)
            has_items = True
        elif os.path.isfile(item_path):
            # دکمه دانلود برای فایل
            btn = types.InlineKeyboardButton(f"📄 {item}", callback_data=f"download_{rel_path}_{item}")
            markup.add(btn)
            has_items = True
    
    if not has_items:
        bot.edit_message_text(f"📁 **{display_path}**\n\nاین پوشه خالی است.", call.message.chat.id, call.message.message_id, reply_markup=markup, parse_mode='Markdown')
    else:
        bot.edit_message_text(f"📁 **{display_path}**\n\n{len(items)} مورد:", call.message.chat.id, call.message.message_id, reply_markup=markup, parse_mode='Markdown')
    
    bot.answer_callback_query(call.id)

@bot.callback_query_handler(func=lambda call: call.data.startswith('download_'))
def handle_download(call):
    parts = call.data.split('_')[1:]
    rel_path = '_'.join(parts[:-1])
    filename = parts[-1]
    
    file_path = os.path.join(TELEGRAM_DIR, rel_path.replace('_', '/'), filename)
    
    if not os.path.exists(file_path):
        bot.answer_callback_query(call.id, "فایل یافت نشد")
        return
    
    # بررسی حجم (حداکثر 20 مگابایت برای ربات بله)
    file_size = os.path.getsize(file_path)
    if file_size > 20 * 1024 * 1024:
        bot.answer_callback_query(call.id, f"فایل {file_size/(1024*1024):.1f} مگابایت است و قابل ارسال نیست")
        return
    
    try:
        with open(file_path, 'rb') as f:
            bot.send_document(call.message.chat.id, f, caption=f"📄 {filename}")
        bot.answer_callback_query(call.id, "✅ فایل ارسال شد")
    except Exception as e:
        bot.answer_callback_query(call.id, f"خطا: {str(e)[:50]}")

@bot.message_handler(commands=['workflows'])
@auth_required
def list_workflows(message):
    """لیست ورکفلوها و اجرا"""
    markup = types.InlineKeyboardMarkup(row_width=1)
    
    if os.path.exists(WORKFLOWS_DIR):
        for file in sorted(os.listdir(WORKFLOWS_DIR)):
            if file.endswith('.yml') or file.endswith('.yaml'):
                workflow_name = file.replace('.yml', '').replace('.yaml', '')
                btn = types.InlineKeyboardButton(f"🚀 {workflow_name}", callback_data=f"run_{workflow_name}")
                markup.add(btn)
    
    markup.add(types.InlineKeyboardButton("🔄 بروزرسانی لیست", callback_data="refresh_workflows"))
    
    bot.reply_to(message, "📋 **لیست ورکفلوهای موجود:**\n\nروی هر کدام کلیک کنید تا اجرا شود.", reply_markup=markup, parse_mode='Markdown')

@bot.callback_query_handler(func=lambda call: call.data.startswith('run_'))
def run_workflow(call):
    workflow_name = call.data[4:]
    
    # پیدا کردن فایل واقعی
    workflow_file = None
    if os.path.exists(WORKFLOWS_DIR):
        for file in os.listdir(WORKFLOWS_DIR):
            if file.startswith(workflow_name) and (file.endswith('.yml') or file.endswith('.yaml')):
                workflow_file = file
                break
    
    if not workflow_file:
        bot.answer_callback_query(call.id, "ورکفلو یافت نشد")
        return
    
    # اجرا از طریق GitHub API
    repo = os.environ.get('GITHUB_REPOSITORY', 'ehsan-golshani/aio-downloader-ehsan')
    token = os.environ.get('GITHUB_TOKEN')
    
    if token:
        url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow_file}/dispatches"
        response = requests.post(url, json={'ref': 'main'}, headers={
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github.v3+json'
        })
        
        if response.status_code == 204:
            bot.answer_callback_query(call.id, f"✅ {workflow_name} با موفقیت اجرا شد!")
            bot.send_message(call.message.chat.id, f"🚀 **ورکفلو {workflow_name} اجرا شد!**\n\nمی‌توانید نتیجه را در برگه Actions ببینید.", parse_mode='Markdown')
        else:
            bot.answer_callback_query(call.id, f"خطا: {response.status_code}")
    else:
        bot.answer_callback_query(call.id, "توکن API موجود نیست")

@bot.message_handler(commands=['channels'])
@auth_required
def manage_channels(message):
    """مدیریت کانال‌ها (channels.json)"""
    markup = types.InlineKeyboardMarkup(row_width=2)
    
    btn_list = types.InlineKeyboardButton("📋 لیست کانال‌ها", callback_data="channels_list")
    btn_add = types.InlineKeyboardButton("➕ اضافه کردن", callback_data="channels_add")
    btn_remove = types.InlineKeyboardButton("❌ حذف کانال", callback_data="channels_remove")
    btn_back = types.InlineKeyboardButton("🔙 بازگشت", callback_data="channels_back")
    
    markup.add(btn_list, btn_add)
    markup.add(btn_remove)
    markup.add(btn_back)
    
    bot.reply_to(message, "📺 **مدیریت کانال‌ها**\n\nکانال‌ها در فایل `channels.json` ذخیره می‌شوند.\nبا اضافه یا حذف کانال، پوشه مربوطه در `telegram/` نیز ساخته یا حذف می‌شود.", reply_markup=markup, parse_mode='Markdown')

@bot.callback_query_handler(func=lambda call: call.data.startswith('channels_'))
def handle_channels(call):
    action = call.data.split('_')[1]
    
    # بارگذاری channels.json
    channels = []
    if os.path.exists(CHANNELS_FILE):
        try:
            with open(CHANNELS_FILE, 'r') as f:
                data = json.load(f)
                channels = data.get('channels', [])
        except:
            pass
    
    if action == 'list':
        if channels:
            text = "📋 **لیست کانال‌های فعال:**\n\n"
            for i, ch in enumerate(channels, 1):
                text += f"{i}. `{ch}`\n"
        else:
            text = "📋 **هیچ کانالی وجود ندارد.**\n\nاز دکمه افزودن استفاده کنید."
        
        bot.edit_message_text(text, call.message.chat.id, call.message.message_id, parse_mode='Markdown')
        
        # دکمه بازگشت
        markup = types.InlineKeyboardMarkup()
        markup.add(types.InlineKeyboardButton("🔙 بازگشت", callback_data="channels_back"))
        bot.edit_message_reply_markup(call.message.chat.id, call.message.message_id, reply_markup=markup)
        
    elif action == 'add':
        bot.edit_message_text("➕ **افزودن کانال جدید**\n\nلطفاً نام کانال را ارسال کنید:", call.message.chat.id, call.message.message_id, parse_mode='Markdown')
        bot.register_next_step_handler(call.message, add_channel_step)
        
    elif action == 'remove':
        if not channels:
            bot.answer_callback_query(call.id, "هیچ کانالی برای حذف وجود ندارد")
            return
        
        markup = types.InlineKeyboardMarkup(row_width=1)
        for ch in channels:
            btn = types.InlineKeyboardButton(f"❌ {ch}", callback_data=f"remove_channel_{ch}")
            markup.add(btn)
        markup.add(types.InlineKeyboardButton("🔙 انصراف", callback_data="channels_back"))
        
        bot.edit_message_text("❌ **حذف کانال**\n\nکانال مورد نظر را انتخاب کنید:", call.message.chat.id, call.message.message_id, reply_markup=markup, parse_mode='Markdown')
        
    elif action == 'back':
        # بازگشت به منوی اصلی
        manage_channels(call.message)

def add_channel_step(message):
    channel_name = message.text.strip()
    
    # بارگذاری channels.json
    channels = []
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            data = json.load(f)
            channels = data.get('channels', [])
    
    if channel_name in channels:
        bot.reply_to(message, f"❌ کانال `{channel_name}` قبلاً وجود دارد!", parse_mode='Markdown')
        return
    
    # اضافه کردن
    channels.append(channel_name)
    with open(CHANNELS_FILE, 'w') as f:
        json.dump({'channels': channels}, f, indent=2)
    
    # ایجاد پوشه مربوطه در telegram/
    channel_dir = os.path.join(TELEGRAM_DIR, channel_name)
    os.makedirs(channel_dir, exist_ok=True)
    
    bot.reply_to(message, f"✅ کانال `{channel_name}` با موفقیت اضافه شد!\nپوشه `telegram/{channel_name}/` ایجاد شد.", parse_mode='Markdown')

@bot.callback_query_handler(func=lambda call: call.data.startswith('remove_channel_'))
def remove_channel_step(call):
    channel_name = call.data.replace('remove_channel_', '')
    
    # بارگذاری channels.json
    channels = []
    if os.path.exists(CHANNELS_FILE):
        with open(CHANNELS_FILE, 'r') as f:
            data = json.load(f)
            channels = data.get('channels', [])
    
    if channel_name in channels:
        channels.remove(channel_name)
        with open(CHANNELS_FILE, 'w') as f:
            json.dump({'channels': channels}, f, indent=2)
        
        # حذف پوشه مربوطه (اختیاری)
        import shutil
        channel_dir = os.path.join(TELEGRAM_DIR, channel_name)
        if os.path.exists(channel_dir):
            shutil.rmtree(channel_dir)
        
        bot.answer_callback_query(call.id, f"✅ {channel_name} حذف شد")
        bot.edit_message_text(f"✅ کانال `{channel_name}` با موفقیت حذف شد!", call.message.chat.id, call.message.message_id, parse_mode='Markdown')
    else:
        bot.answer_callback_query(call.id, "کانال یافت نشد")

@bot.message_handler(commands=['lastid'])
@auth_required
def show_last_id(message):
    """نمایش و تغییر last_id"""
    current_id = ""
    if os.path.exists(LAST_ID_FILE):
        with open(LAST_ID_FILE, 'r') as f:
            current_id = f.read().strip()
    
    markup = types.InlineKeyboardMarkup()
    btn_change = types.InlineKeyboardButton("✏️ تغییر last_id", callback_data="change_lastid")
    markup.add(btn_change)
    
    bot.reply_to(message, f"📊 **آخرین ID ذخیره شده:**\n\n`{current_id if current_id else 'تعیین نشده'}`\n\nبرای تغییر، روی دکمه زیر کلیک کنید.", reply_markup=markup, parse_mode='Markdown')

@bot.callback_query_handler(func=lambda call: call.data == 'change_lastid')
def change_lastid_prompt(call):
    bot.edit_message_text("✏️ **تغییر last_id**\n\nلطفاً مقدار جدید را ارسال کنید:", call.message.chat.id, call.message.message_id, parse_mode='Markdown')
    bot.register_next_step_handler(call.message, update_last_id)

def update_last_id(message):
    new_id = message.text.strip()
    
    with open(LAST_ID_FILE, 'w') as f:
        f.write(new_id)
    
    bot.reply_to(message, f"✅ `last_id` با موفقیت به `{new_id}` تغییر یافت!", parse_mode='Markdown')

@bot.message_handler(commands=['help'])
