name: Build Bale Bot v2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # حذف پوشه قدیمی bale-bot اگر وجود داشته باشد
      - name: Delete old bale-bot
        run: rm -rf bale-bot

      - name: Create new structure and bot files
        run: |
          # ایجاد ساختار جدید
          mkdir -p bale-bot/data

          # فایل requirements
          cat > bale-bot/requirements.txt << 'EOF'
          pyTelegramBotAPI
          requests
          EOF

          # ---------- فایل اصلی config.py ----------
          cat > bale-bot/config.py << 'EOF'
          import os
          import hashlib
          import json
          
          # مسیرهای اصلی پروژه (دسترسی به ریشه مخزن)
          REPO_ROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
          TELEGRAM_DIR = os.path.join(REPO_ROOT, "telegram")
          CHANNEL_JSON = os.path.join(REPO_ROOT, "channel.json")
          LAST_ID_FILE = os.path.join(REPO_ROOT, "last_id.txt")
          
          # مسیرهای ربات
          BOT_DATA = os.path.join(os.path.dirname(__file__), "data")
          PASSWORD_HASH_FILE = os.path.join(BOT_DATA, "password.hash")
          
          # توکن ربات از Environment (بدون نیاز به Secret در Actions، در حین ران شدن استفاده می‌شود)
          BOT_TOKEN = os.environ.get('BALE_TOKEN')
          
          # تابع هش کردن رمز (PBKDF2)
          def hash_password(password, salt=None):
              if salt is None:
                  salt = os.urandom(32).hex()
              else:
                  salt = salt
              hash_val = hashlib.pbkdf2_hmac('sha256', password.encode(), salt.encode(), 100000).hex()
              return hash_val, salt
          
          def verify_password(stored_hash, salt, input_password):
              check_hash = hashlib.pbkdf2_hmac('sha256', input_password.encode(), salt.encode(), 100000).hex()
              return check_hash == stored_hash
          EOF

          # ---------- فایل اصلی bot.py ----------
          cat > bale-bot/bot.py << 'EOF'
          import telebot
          import os
          import json
          import subprocess
          import requests
          from telebot import api
          from telebot.types import InlineKeyboardMarkup, InlineKeyboardButton
          
          api.TELEGRAM_API_URL = 'https://tapi.bale.ai/bot{0}/{1}'
          
          from config import *
          
          bot = telebot.TeleBot(BOT_TOKEN)
          
          # وضعیت احراز هویت موقت (در حافظه)
          authenticated_users = set()
          
          # بارگذاری هش رمز از فایل
          def load_password_hash():
              if os.path.exists(PASSWORD_HASH_FILE):
                  with open(PASSWORD_HASH_FILE, 'r') as f:
                      data = json.load(f)
                      return data.get('hash'), data.get('salt')
              return None, None
          
          def save_password_hash(hash_val, salt):
              with open(PASSWORD_HASH_FILE, 'w') as f:
                  json.dump({'hash': hash_val, 'salt': salt}, f)
          
          # اگر رمزی تنظیم نشده، ربات منتظر SetPass می‌ماند
          stored_hash, stored_salt = load_password_hash()
          
          @bot.message_handler(commands=['start'])
          def start_cmd(message):
              if stored_hash is None:
                  bot.reply_to(message, "🔐 **ربات برای اولین بار اجرا شده است.**\nلطفا یک رمز عبور قوی ارسال کنید.\n`/setpass <رمز>`", parse_mode='Markdown')
              else:
                  bot.reply_to(message, "🔒 **ربات قفل است.** لطفا احراز هویت کنید:\n`/auth <رمز>`", parse_mode='Markdown')
          
          @bot.message_handler(commands=['setpass'])
          def set_password(message):
              global stored_hash, stored_salt
              if stored_hash is not None:
                  bot.reply_to(message, "رمز عبور قبلاً تنظیم شده است. در صورت فراموشی، فایل را دستی حذف کنید.")
                  return
              parts = message.text.split(maxsplit=1)
              if len(parts) < 2:
                  bot.reply_to(message, "لطفا رمز را وارد کنید: `/setpass mypassword`", parse_mode='Markdown')
                  return
              new_pass = parts[1]
              hash_val, salt_val = hash_password(new_pass)
              save_password_hash(hash_val, salt_val)
              stored_hash, stored_salt = hash_val, salt_val
              bot.reply_to(message, "✅ رمز عبور با موفقیت ذخیره شد. اکنون می‌توانید با `/auth <رمز>` وارد شوید.")
          
          @bot.message_handler(commands=['auth'])
          def auth_cmd(message):
              global stored_hash, stored_salt
              if stored_hash is None:
                  bot.reply_to(message, "ابتدا با `/setpass` رمز عبور را تنظیم کنید.", parse_mode='Markdown')
                  return
              parts = message.text.split(maxsplit=1)
              if len(parts) < 2:
                  bot.reply_to(message, "لطفا رمز را وارد کنید: `/auth mypassword`", parse_mode='Markdown')
                  return
              if verify_password(stored_hash, stored_salt, parts[1]):
                  authenticated_users.add(message.chat.id)
                  bot.reply_to(message, "✅ دسترسی کامل صادر شد. خوش آمدید.")
              else:
                  bot.reply_to(message, "❌ رمز اشتباه است.")
          
          # نمایش منوی اصلی (فقط برای احراز هویت شده‌ها)
          @bot.message_handler(commands=['menu'])
          def menu_cmd(message):
              if message.chat.id not in authenticated_users:
                  bot.reply_to(message, "دسترسی ندارید. لطفا با /auth وارد شوید.")
                  return
              markup = InlineKeyboardMarkup(row_width=2)
              btn1 = InlineKeyboardButton("📂 مرور فایل‌های تلگرام", callback_data="browse_telegram_root")
              btn2 = InlineKeyboardButton("⚙️ اجرای ورکفلو", callback_data="run_workflow_menu")
              btn3 = InlineKeyboardButton("📝 مدیریت کانال‌ها", callback_data="manage_channels")
              markup.add(btn1, btn2, btn3)
              bot.send_message(message.chat.id, "📌 **منوی اصلی ربات**", reply_markup=markup, parse_mode='Markdown')
          
          # ================= بخش مرور پوشه تلگرام (پشتیبانی از دکمه‌های بازگشت) =================
          def generate_folder_buttons(path, callback_prefix):
              markup = InlineKeyboardMarkup(row_width=1)
              if not os.path.exists(path):
                  return markup
              items = os.listdir(path)
              folders = [i for i in items if os.path.isdir(os.path.join(path, i))]
              # دکمه بازگشت به عقب
              if path != TELEGRAM_DIR:
                  parent = os.path.dirname(path)
                  back_btn = InlineKeyboardButton("🔙 بازگشت", callback_data=f"{callback_prefix}|{parent}")
                  markup.add(back_btn)
              for folder in folders:
                  btn = InlineKeyboardButton(f"📁 {folder}", callback_data=f"{callback_prefix}|{os.path.join(path, folder)}")
                  markup.add(btn)
              # نمایش فایل‌ها به عنوان دکمه دانلود
              files = [i for i in items if os.path.isfile(os.path.join(path, i))]
              for file in files[:20]:  # حداکثر 20 فایل
                  btn = InlineKeyboardButton(f"📄 {file}", callback_data=f"download_file|{os.path.join(path, file)}")
                  markup.add(btn)
              return markup
          
          @bot.callback_query_handler(func=lambda call: call.data.startswith("browse_telegram"))
          def handle_browse(call):
              if call.message.chat.id not in authenticated_users:
                  bot.answer_callback_query(call.id, "دسترسی ندارید")
                  return
              # فرمت: browse_telegram|path
              parts = call.data.split("|")
              if len(parts) == 1:
                  current_path = TELEGRAM_DIR
              else:
                  current_path = parts[1]
              markup = generate_folder_buttons(current_path, "browse_telegram")
              bot.edit_message_text(f"📂 مسیر فعلی: `{current_path}`", call.message.chat.id, call.message.message_id, reply_markup=markup, parse_mode='Markdown')
          
          @bot.callback_query_handler(func=lambda call: call.data.startswith("download_file"))
          def handle_download(call):
              if call.message.chat.id not in authenticated_users:
                  bot.answer_callback_query(call.id, "دسترسی ندارید")
                  return
              file_path = call.data.split("|", 1)[1]
              if os.path.exists(file_path) and os.path.getsize(file_path) < 20 * 1024 * 1024:
                  with open(file_path, 'rb') as f:
                      bot.send_document(call.message.chat.id, f, caption=os.path.basename(file_path))
              else:
                  bot.answer_callback_query(call.id, "فایل یافت نشد یا حجمش بیشتر از 20 مگ است")
          
          # ================= مدیریت کانال‌ها (channel.json) و last_id.txt =================
          @bot.callback_query_handler(func=lambda call: call.data == "manage_channels")
          def manage_channels_menu(call):
              if call.message.chat.id not in authenticated_users:
                  bot.answer_callback_query(call.id, "دسترسی ندارید")
                  return
              markup = InlineKeyboardMarkup(row_width=1)
              btn1 = InlineKeyboardButton("➕ اضافه کردن کانال جدید", callback_data="add_channel")
              btn2 = InlineKeyboardButton("🗑 حذف کانال", callback_data="remove_channel")
              btn3 = InlineKeyboardButton("📋 نمایش کانال‌های فعلی", callback_data="list_channels")
              btn4 = InlineKeyboardButton("✏️ ویرایش last_id", callback_data="edit_last_id")
              markup.add(btn1, btn2, btn3, btn4)
              bot.edit_message_text("مدیریت کانال‌ها و آخرین ID:", call.message.chat.id, call.message.message_id, reply_markup=markup)
          
          @bot.callback_query_handler(func=lambda call: call.data == "list_channels")
          def list_channels(call):
              if not os.path.exists(CHANNEL_JSON):
                  bot.answer_callback_query(call.id, "فایل کانال وجود ندارد")
                  return
              with open(CHANNEL_JSON, 'r') as f:
                  channels = json.load(f)
              txt = "📺 لیست کانال‌ها:\n" + "\n".join([f"- {ch['title']} (id: {ch['id']})" for ch in channels])
              bot.send_message(call.message.chat.id, txt)
          
          @bot.callback_query_handler(func=lambda call: call.data == "add_channel")
          def add_channel_prompt(call):
              msg = bot.send_message(call.message.chat.id, "لطفا Title و ID کانال را به صورت `title|id` ارسال کنید.", parse_mode='Markdown')
              bot.register_next_step_handler(msg, process_add_channel)
          
          def process_add_channel(message):
              if "|" not in message.text:
                  bot.reply_to(message, "فرمت اشتباه. مثال: `کانال تست|123456789`")
                  return
              title, cid = message.text.split("|", 1)
              if os.path.exists(CHANNEL_JSON):
                  with open(CHANNEL_JSON, 'r') as f:
                      data = json.load(f)
              else:
                  data = []
              data.append({"title": title.strip(), "id": int(cid.strip())})
              with open(CHANNEL_JSON, 'w') as f:
                  json.dump(data, f, indent=2)
              # ایجاد پوشه مربوطه در telegram/
              os.makedirs(os.path.join(TELEGRAM_DIR, title.strip()), exist_ok=True)
              bot.reply_to(message, f"کانال {title} اضافه شد و پوشه آن ساخته شد.")
          
          @bot.callback_query_handler(func=lambda call: call.data == "remove_channel")
          def remove_channel_prompt(call):
              if not os.path.exists(CHANNEL_JSON):
                  bot.answer_callback_query(call.id, "فایلی وجود ندارد")
                  return
              with open(CHANNEL_JSON, 'r') as f:
                  data = json.load(f)
              if not data:
                  bot.answer_callback_query(call.id, "لیست خالی است")
                  return
              markup = InlineKeyboardMarkup(row_width=1)
              for ch in data:
                  btn = InlineKeyboardButton(f"❌ {ch['title']}", callback_data=f"delchan|{ch['title']}")
                  markup.add(btn)
              bot.edit_message_text("کانال مورد نظر برای حذف انتخاب کنید:", call.message.chat.id, call.message.message_id, reply_markup=markup)
          
          @bot.callback_query_handler(func=lambda call: call.data.startswith("delchan|"))
          def confirm_remove(call):
              title = call.data.split("|", 1)[1]
              with open(CHANNEL_JSON, 'r') as f:
                  data = json.load(f)
              new_data = [ch for ch in data if ch['title'] != title]
              with open(CHANNEL_JSON, 'w') as f:
                  json.dump(new_data, f, indent=2)
              bot.answer_callback_query(call.id, f"کانال {title} حذف شد")
              bot.edit_message_text("حذف انجام شد.", call.message.chat.id, call.message.message_id)
          
          @bot.callback_query_handler(func=lambda call: call.data == "edit_last_id")
          def edit_last_id_prompt(call):
              current = ""
              if os.path.exists(LAST_ID_FILE):
                  with open(LAST_ID_FILE, 'r') as f:
                      current = f.read().strip()
              msg = bot.send_message(call.message.chat.id, f"مقدار فعلی last_id: `{current}`\nلطفا مقدار جدید را به صورت عددی ارسال کنید.", parse_mode='Markdown')
              bot.register_next_step_handler(msg, save_last_id)
          
          def save_last_id(message):
              try:
                  val = int(message.text.strip())
                  with open(LAST_ID_FILE, 'w') as f:
                      f.write(str(val))
                  bot.reply_to(message, f"✅ last_id تغییر کرد به {val}")
              except:
                  bot.reply_to(message, "عدد معتبر وارد کنید.")
          
          # ================= اجرای ورکفلو از طریق GitHub API =================
          @bot.callback_query_handler(func=lambda call: call.data == "run_workflow_menu")
          def workflow_menu(call):
              if call.message.chat.id not in authenticated_users:
                  bot.answer_callback_query(call.id, "دسترسی ندارید")
                  return
              # دریافت لیست ورکفلوها از طریق GitHub API
              repo = os.environ.get('GITHUB_REPOSITORY') or "ehsan-golshani/aio-downloader-ehsan"
              token = os.environ.get('GITHUB_TOKEN')
              url = f"https://api.github.com/repos/{repo}/actions/workflows"
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github.v3+json"}
              try:
                  resp = requests.get(url, headers=headers)
                  workflows = resp.json().get('workflows', [])
                  markup = InlineKeyboardMarkup(row_width=1)
                  for wf in workflows:
                      if wf['state'] == 'active':
                          btn = InlineKeyboardButton(wf['name'], callback_data=f"trigger_wf|{wf['id']}")
                          markup.add(btn)
                  bot.edit_message_text("ورکفلوهای موجود برای اجرا:", call.message.chat.id, call.message.message_id, reply_markup=markup)
              except:
                  bot.send_message(call.message.chat.id, "خطا در دریافت لیست ورکفلوها")
          
          @bot.callback_query_handler(func=lambda call: call.data.startswith("trigger_wf|"))
          def trigger_workflow(call):
              wf_id = call.data.split("|", 1)[1]
              repo = os.environ.get('GITHUB_REPOSITORY') or "ehsan-golshani/aio-downloader-ehsan"
              token = os.environ.get('GITHUB_TOKEN')
              url = f"https://api.github.com/repos/{repo}/actions/workflows/{wf_id}/dispatches"
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github.v3+json"}
              payload = {"ref": "main"}
              resp = requests.post(url, json=payload, headers=headers)
              if resp.status_code == 204:
                  bot.answer_callback_query(call.id, "✅ ورکفلو با موفقیت اجرا شد")
              else:
                  bot.answer_callback_query(call.id, f"خطا: {resp.status_code}")
          
          print("ربات Bale v2.0 راه‌اندازی شد")
          bot.infinity_polling()
          EOF

          # ---------- اکشن زمانبندی برای اجرای ربات ----------
          mkdir -p .github/workflows
          cat > .github/workflows/run_bale_bot.yml << 'EOF'
          name: Run Bale Bot
          on:
            schedule:
              - cron: '*/2 * * * *'
            workflow_dispatch:
          jobs:
            run:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.9'
                - name: Install deps
                  working-directory: ./bale-bot
                  run: pip install -r requirements.txt
                - name: Start Bot
                  working-directory: ./bale-bot
                  env:
                    BALE_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                  run: timeout 115s python bot.py || true
          EOF

          # ایجاد فایل .env.example برای راهنما
          cat > bale-bot/.env.example << 'EOF'
          برای اجرا نیاز به تنظیم Secret به نام BALE_BOT_TOKEN در Settings -> Secrets دارید.
          EOF

          echo "✅ ساختار جدید ربات ساخته شد و پوشه قدیمی حذف گردید."

      - name: Commit and push
        run: |
          git config user.name "BaleBuilder"
          git config user.email "bot@builder.local"
          git add bale-bot .github/workflows/run_bale_bot.yml
          git commit -m "نسخه 2.0 ربات بله با قابلیت Browse و مدیریت کانال" || echo "تغییری نیست"
          git push