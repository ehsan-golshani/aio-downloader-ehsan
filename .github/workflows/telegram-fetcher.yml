name: telegram-fetcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: '📢 نام کانال (برای +۱۰ پست سفارشی)'
        required: false
        type: string
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests jdatetime
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run archiver
        env:
          TARGET_CHANNEL: ${{ github.event.inputs.channel }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          if [ -n "$TARGET_CHANNEL" ] && [ "$TARGET_CHANNEL" != "null" ]; then
            echo "🎯 Custom archive (+10 messages) for: $TARGET_CHANNEL"
            python .github/script/fetch_telegram_pw.py --channel "$TARGET_CHANNEL" --limit 10
          else
            echo "🔄 Normal update for all channels"
            python .github/script/fetch_telegram_pw.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add telegram/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes"
            exit 0
          fi
          
          if [ -n "$TARGET_CHANNEL" ] && [ "$TARGET_CHANNEL" != "null" ]; then
            git commit -m "📦 +10 messages for $TARGET_CHANNEL [skip ci]" || exit 0
          else
            git commit -m "🔄 Update Telegram archive [skip ci]" || exit 0
          fi
          
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
            if git push origin ${{ github.ref_name }}; then
              echo "✅ Push succeeded"
              exit 0
            fi
            sleep 3
          done
          exit 1