# .github/workflows/telegram-fetcher.yml
name: Telegram Channel Fetcher

on:
  schedule:
    # هر ۱۵ دقیقه یکبار اجرا میشه (با تأخیر احتمالی)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کانال (مثلاً VahidOOnLine) - برای آرشیو دستی ۱۰ پیام بیشتر'
        required: true
        default: ''
        type: string

jobs:
  fetch-telegram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright requests jdatetime
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: Run Telegram Fetcher
        env:
          # ---------- مهم: آدرس مخزن جدید را اینجا یک بار ست کن ----------
          REPO_OWNER: "ehsan-golshani"
          REPO_NAME: "aio-downloader-ehsan"
          TARGET_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          python .github/scripts/fetch_telegram_pw.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram/ || true
          git diff --staged --quiet || git commit -m "Update Telegram archive [skip ci]"
          git push