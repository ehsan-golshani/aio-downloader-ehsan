name: aio-cleaner

on:
  workflow_dispatch:
    inputs:
      clean_all:
        description: 'پاک کردن همه چیز'
        required: false
        type: boolean
        default: false
      clean_telegram:
        description: 'پاک کردن دیتای Telegram (media, pages, file-base64, last_ids)'
        required: false
        type: boolean
        default: false
      clean_youtube:
        description: 'پاک کردن Youtube'
        required: false
        type: boolean
        default: false
      clean_x:
        description: 'پاک کردن X'
        required: false
        type: boolean
        default: false
      clean_instagram:
        description: 'پاک کردن Instagram'
        required: false
        type: boolean
        default: false
      clean_website:
        description: 'پاک کردن Website'
        required: false
        type: boolean
        default: false
      clean_leecher:
        description: 'پاک کردن Leecher'
        required: false
        type: boolean
        default: false

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean selected platforms
        env:
          CLEAN_ALL: ${{ github.event.inputs.clean_all }}
          CLEAN_TELEGRAM: ${{ github.event.inputs.clean_telegram }}
          CLEAN_YOUTUBE: ${{ github.event.inputs.clean_youtube }}
          CLEAN_X: ${{ github.event.inputs.clean_x }}
          CLEAN_INSTAGRAM: ${{ github.event.inputs.clean_instagram }}
          CLEAN_WEBSITE: ${{ github.event.inputs.clean_website }}
          CLEAN_LEECHER: ${{ github.event.inputs.clean_leecher }}
        run: |
          python << 'EOF'
          import shutil, os
          from pathlib import Path

          clean_all = os.environ.get("CLEAN_ALL") == "true"
          platforms = []
          
          if clean_all:
              platforms = ["telegram", "youtube", "x", "instagram", "website", "leecher"]
          else:
              if os.environ.get("CLEAN_TELEGRAM") == "true":
                  platforms.append("telegram")
              if os.environ.get("CLEAN_YOUTUBE") == "true":
                  platforms.append("youtube")
              if os.environ.get("CLEAN_X") == "true":
                  platforms.append("x")
              if os.environ.get("CLEAN_INSTAGRAM") == "true":
                  platforms.append("instagram")
              if os.environ.get("CLEAN_WEBSITE") == "true":
                  platforms.append("website")
              if os.environ.get("CLEAN_LEECHER") == "true":
                  platforms.append("leecher")

          if not platforms:
              print("ℹ️ هیچ پلتفرمی انتخاب نشده")
              exit(0)

          cleaned = []
          
          for platform in platforms:
              if platform == "telegram":
                  # پاک کردن پوشه data (ساختار جدید)
                  data_dir = Path("telegram") / "data"
                  if data_dir.exists():
                      shutil.rmtree(data_dir)
                      print("🧹 Deleted telegram/data/ (pages, media, file-base64)")
                      cleaned.append("telegram/data")
                  
                  # پاک کردن content قدیمی (برای سازگاری)
                  content_dir = Path("telegram") / "content"
                  if content_dir.exists():
                      shutil.rmtree(content_dir)
                      print("🧹 Deleted telegram/content/ (old media)")
                      cleaned.append("telegram/content")
                  
                  # پاک کردن last_ids.json
                  last_ids_file = Path("telegram") / "last_ids.json"
                  if last_ids_file.exists():
                      last_ids_file.unlink()
                      print("🧹 Deleted telegram/last_ids.json")
                      cleaned.append("telegram/last_ids.json")
                  
              elif platform == "leecher":
                  folder = Path("leecher")
                  if folder.exists():
                      shutil.rmtree(folder)
                      print("🧹 Deleted leecher/")
                      cleaned.append("leecher")
                  
              else:
                  folder = Path(platform)
                  if folder.exists():
                      shutil.rmtree(folder)
                      print(f"🧹 Deleted {platform}/")
                      cleaned.append(platform)

          with open("/tmp/cleaned_platforms.txt", "w") as f:
              f.write(",".join(cleaned))
          EOF

      - name: Commit and push deletions
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          PLATFORMS=$(cat /tmp/cleaned_platforms.txt)
          if [ -z "$PLATFORMS" ]; then
            echo "No changes to commit"
            exit 0
          fi

          IFS=',' read -ra PLATFORM_ARRAY <<< "$PLATFORMS"
          for p in "${PLATFORM_ARRAY[@]}"; do
            if [ "$p" = "telegram/data" ]; then
              git add -A telegram/data/ 2>/dev/null || true
            elif [ "$p" = "telegram/content" ]; then
              git add -A telegram/content/ 2>/dev/null || true
            elif [ "$p" = "telegram/last_ids.json" ]; then
              git add -A telegram/last_ids.json 2>/dev/null || true
            else
              git add -A "$p/" 2>/dev/null || true
            fi
          done

          if git diff --staged --quiet; then
            echo "No deletions to commit"
            exit 0
          fi

          git commit -m "🧹 Cleaned: $PLATFORMS [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed, retry $i/5..."
            sleep 3
          done
          exit 1