name: Delete Folder from Repo

on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: 'نام پوشه'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - run: |
        rm -rf "${{ github.inputs.folder_name }}"
        git config user.name "bot"
        git config user.email "bot@users.noreply.github.com"
        git add -A
        git commit -m "delete folder" || echo "no changes"
        git push