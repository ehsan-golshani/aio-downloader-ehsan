name: Delete Custom Folder

on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: 'نام پوشه برای حذف'
        required: true
        type: string
        default: 'temp'

jobs:
  delete-folder:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Remove folder
      run: |
        rm -rf "${{ github.event.inputs.folder_name }}"
        echo "پوشه ${{ github.event.inputs.folder_name }} حذف شد"
    
    - name: Push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -A
        git commit -m "Remove ${{ github.event.inputs.folder_name }}" || echo "تغییری وجود ندارد"
        git push