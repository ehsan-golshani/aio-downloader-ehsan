name: Final Fix & Setup Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      # ما رمز عبور را در اینجا از Secrets می‌خوانیم.
      # ابتدا باید یک Secret موقتی با نام BOT_RAW_PASSWORD بسازیم.
      # اما فعلا یک رمز پیش‌فرض می‌گذاریم و شما بعدا عوضش می‌کنید.
      - name: Generate Hash and Update Secrets
        env:
          # اینجا رمز واقعی را وارد کنید. 
          # اگر می‌خواهید رمزتان "123456" باشد، همین پایین بنویسید.
          RAW_PASSWORD: "my_strong_password_123"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # تولید هش و سالت
          SALT=$(openssl rand -hex 32)
          HASH=$(echo -n "$RAW_PASSWORD$SALT" | openssl dgst -sha256 -hex | cut -d' ' -f2)
          
          echo "SALT=$SALT"
          echo "HASH=$HASH"
          
          # به روز رسانی Secrets با استفاده از gh cli
          echo "$HASH" | gh secret set BOT_PASSWORD_HASH --repo "${{ github.repository }}"
          echo "$SALT" | gh secret set PASSWORD_SALT --repo "${{ github.repository }}"
          
          # ایجاد فایل راهنما در مخزن
          cat > HOW_TO_USE_BOT.txt << EOF
          ═══════════════════════════════════════════
          ✅ ربات با موفقیت تنظیم شد!
          ═══════════════════════════════════════════
          
          رمز عبور شما (برای دستور /auth در بله) عبارت است از:
          $RAW_PASSWORD
          
          توکن ربات (BALE_BOT_TOKEN) در Secrets ذخیره شده.
          
          حالا می‌توانید ربات را در بله استارت کنید.
          ═══════════════════════════════════════════
          EOF
          
          # ایجاد پوشه و فایل‌های ربات
          mkdir -p bale-bot/files
          
          cat > bale-bot/bot.py << 'BOT'
import telebot
import os
import glob
import json
import hashlib
from telebot import api

api.TELEGRAM_API_URL = 'https://tapi.bale.ai/bot{0}/{1}'

BOT_TOKEN = os.environ.get('BALE_TOKEN')
REQUIRED_HASH = os.environ.get('BOT_PASSWORD_HASH')
SALT = os.environ.get('PASSWORD_SALT')

bot = telebot.TeleBot(BOT_TOKEN)
AUTH_FILE = 'auth.json'

def is_authenticated(user_id):
    if not os.path.exists(AUTH_FILE): return False
    with open(AUTH_FILE, 'r') as f:
        data = json.load(f)
        return str(user_id) in data.get('users', [])

def save_auth(user_id):
    users = []
    if os.path.exists(AUTH_FILE):
        with open(AUTH_FILE, 'r') as f:
            users = json.load(f).get('users', [])
    if str(user_id) not in users:
        users.append(str(user_id))
    with open(AUTH_FILE, 'w') as f:
        json.dump({'users': users}, f)

@bot.message_handler(commands=['start'])
def start(m):
    bot.reply_to(m, "🔐 ربات شخصی. لطفا /auth <رمز> را بفرستید.")

@bot.message_handler(commands=['auth'])
def auth(m):
    parts = m.text.split()
    if len(parts) != 2:
        bot.reply_to(m, "فرمت: /auth <رمز>")
        return
    pwd = parts[1]
    input_hash = hashlib.sha256((pwd + SALT).encode()).hexdigest()
    if input_hash == REQUIRED_HASH:
        save_auth(m.chat.id)
        bot.reply_to(m, "✅ دسترسی صادر شد.")
    else:
        bot.reply_to(m, "❌ رمز اشتباه است.")

@bot.message_handler(commands=['list'])
def list_files(m):
    if not is_authenticated(m.chat.id):
        bot.reply_to(m, "دسترسی ندارید. ابتدا /auth کنید.")
        return
    # اینجا فعلا فقط یک پیام نمونه می‌دهیم
    bot.reply_to(m, "لیست فایل‌ها: فعلا فایلی وجود ندارد. (بعدا اضافه می‌شود)")

print("ربات روشن شد...")
bot.infinity_polling()
BOT
          
          cat > bale-bot/requirements.txt << EOF
pyTelegramBotAPI
EOF
          
          git add .
          git commit -m "Add bot files and instructions"
          git push