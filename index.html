<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه تست گیت‌هاب</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .time {
            font-size: 48px;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
            direction: ltr;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active {
            transform: scale(0.95);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 سلام!</h1>
        <p>این فایل از گیت‌هاب اجرا شده</p>
        <div class="time" id="clock">--:--:--</div>
        <button onclick="showMessage()">کلیک کن</button>
        <button onclick="changeColor()" style="background:#764ba2; margin-right:10px;">تغییر رنگ</button>
        <div class="footer">
            ✅ اگر این صفحه را می‌بینی، یعنی درست کار می‌کند
        </div>
    </div>

    <script>
        // ساعت لحظه‌ای
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('fa-IR');
            document.getElementById('clock').textContent = time;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // پیام کلیک
        function showMessage() {
            alert('👋 صفحه گیت‌هاب با موفقیت اجرا شد!');
        }

        // تغییر رنگ تصادفی
        function changeColor() {
            const colors = ['#667eea', '#e74c3c', '#2ecc71', '#f39c12', '#1abc9c'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.querySelector('.card').style.boxShadow = `0 20px 60px ${randomColor}80`;
            document.querySelector('h1').style.color = randomColor;
        }
    </script>
</body>
</html>
