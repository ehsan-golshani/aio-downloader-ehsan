<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دانلود فایل YT @Tasiyanc.npvt</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1f1f1f;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h2 {
            color: #2aabee;
            margin-bottom: 16px;
            text-align: center;
        }
        .info {
            background: #2b2b2b;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            word-break: break-all;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2aabee, #7c3aed);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .status {
            margin-top: 16px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            display: none;
        }
        .success { background: #10b981; color: white; display: block; }
        .error { background: #ef4444; color: white; display: block; }
        .loading { background: #f59e0b; color: white; display: block; }
        .note {
            margin-top: 16px;
            font-size: 11px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📥 دانلود فایل</h2>
        <div class="info">
            <div>📄 نام فایل: <strong>YT @Tasiyanc.npvt</strong></div>
            <div>📦 حجم اصلی: <span id="originalSize">در حال محاسبه...</span></div>
            <div>🔐 فرمت: Base64 Encoded</div>
        </div>
        <button id="downloadBtn">⬇️ دانلود و دیکود فایل</button>
        <div id="status" class="status"></div>
        <div class="note">
            💡 این فایل به صورت Base64 ذخیره شده است. با کلیک روی دکمه، فایل دیکود و دانلود می‌شود.
        </div>
    </div>
    <script>
        const base64Data = ` + "`" + base64_data + "`" + `;
        const filename = 'YT @Tasiyanc.npvt';
        
        function showStatus(msg, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = msg;
            statusDiv.className = 'status ' + type;
        }
        
        document.getElementById('downloadBtn').onclick = function() {
            try {
                showStatus('🔄 در حال دیکود کردن فایل...', 'loading');
                
                // دیکود Base64
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                // ساخت Blob و دانلود
                const blob = new Blob([bytes]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showStatus('✅ دانلود کامل شد!', 'success');
                setTimeout(() => window.close(), 2000);
            } catch(e) {
                showStatus('❌ خطا در دیکود فایل: ' + e.message, 'error');
            }
        };
        
        // محاسبه حجم اصلی
        try {
            const binaryLen = atob(base64Data).length;
            document.getElementById('originalSize').textContent = (binaryLen / 1024).toFixed(1) + ' KB';
        } catch(e) {
            document.getElementById('originalSize').textContent = 'نامشخص';
        }
    </script>
</body>
</html>
